  const sd = sdfFromAlpha(alpha, cw, ch);

  const G = new Float32Array(GX * GY), uPerPx = (2 * MW) / cw;
  for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) {
    let acc = 0;
    for (let b = 0; b < res; b++) for (let a = 0; a < res; a++) {
      const px = i * res + a, py = (GY - 1 - j) * res + b;
      acc += sd[py * cw + px];
    }
    G[j * GX + i] = (acc / (res * res)) * uPerPx;
  }
  return { G, capU: (asc) * uPerPx, size, widthU: vis * uPerPx, ascU: asc * uPerPx, descU: desc * uPerPx };
}

/* ---- isobands: terraces from a scalar field (level units) ----
   caps : x z lv lv 0 0 0 g       (8 floats / vertex, triangles; g = field value, for analytic contour lines)
   walls: x z lvLo lvHi t nx nz g (8 floats / vertex, triangles)
   segs : x0 z0 x1 z1 lv          (5 floats / instance)                       */
function Isobands() {
  const verts = new FBuf(1 << 20), segs = new FBuf(1 << 18), runs = new FBuf(1 << 16);
  const P = new Float64Array(48), Q2 = new Float64Array(48);   // scratch polygons (x,y,g)*n
  function emitTri(ax, ay, bx, by, cx, cy, lv, ga, gb, gc) {
    verts.need(24); const a = verts.a; let n = verts.n;
    a[n++] = ax; a[n++] = -ay; a[n++] = lv; a[n++] = lv; a[n++] = 0; a[n++] = 0; a[n++] = 0; a[n++] = ga;
    a[n++] = bx; a[n++] = -by; a[n++] = lv; a[n++] = lv; a[n++] = 0; a[n++] = 0; a[n++] = 0; a[n++] = gb;
    a[n++] = cx; a[n++] = -cy; a[n++] = lv; a[n++] = lv; a[n++] = 0; a[n++] = 0; a[n++] = 0; a[n++] = gc;
    verts.n = n;
  }
  function emitWall(ax, ay, bx, by, lo, hi, nx, ny) {
    // world normal (q.y -> -z)
    const wx = nx, wz = -ny;
    verts.need(48); const a = verts.a; let n = verts.n;
    const V = (x, y, t) => { a[n++] = x; a[n++] = -y; a[n++] = lo; a[n++] = hi; a[n++] = t; a[n++] = wx; a[n++] = wz; a[n++] = hi; };
    V(ax, ay, 0); V(bx, by, 0); V(bx, by, 1);
    V(ax, ay, 0); V(bx, by, 1); V(ax, ay, 1);
    verts.n = n;
  }
  // canonical edge crossing: identical result whichever triangle (and direction) asks -> watertight mesh
  let CX = 0, CY = 0;
  function cross(ax, ay, ag, bx, by, bg, lv) {
    if (ax > bx || (ax === bx && ay > by)) { let s = ax; ax = bx; bx = s; s = ay; ay = by; by = s; s = ag; ag = bg; bg = s; }
    const t = (lv - ag) / (bg - ag);
    CX = ax + (bx - ax) * t; CY = ay + (by - ay) * t;
  }
  // clip polygon src (len m) keeping g >= lv (sign=+1) or g <= lv (sign=-1); returns new length in dst
  function clip(src, m, dst, lv, sign) {
    let k = 0;
    for (let i = 0; i < m; i++) {
      const j = (i + 1) % m;
      const ax = src[i * 3], ay = src[i * 3 + 1], ag = src[i * 3 + 2];
      const bx = src[j * 3], by = src[j * 3 + 1], bg = src[j * 3 + 2];
      const ain = sign > 0 ? ag >= lv : ag <= lv, bin = sign > 0 ? bg >= lv : bg <= lv;
      if (ain) { dst[k * 3] = ax; dst[k * 3 + 1] = ay; dst[k * 3 + 2] = ag; k++; }
      if (ain !== bin) { cross(ax, ay, ag, bx, by, bg, lv); dst[k * 3] = CX; dst[k * 3 + 1] = CY; dst[k * 3 + 2] = lv; k++; }
    }
    return k;
  }
  function tri(x0, y0, g0, x1, y1, g1, x2, y2, g2, L) {
    const gmin = Math.min(g0, g1, g2), gmax = Math.max(g0, g1, g2);
    const lo = clamp(Math.floor(gmin), 0, L), hi = clamp(Math.floor(gmax), 0, L);
    if (lo === hi) { emitTri(x0, y0, x1, y1, x2, y2, lo, g0, g1, g2); return; }
    for (let lv = lo; lv <= hi; lv++) {
      P[0] = x0; P[1] = y0; P[2] = g0; P[3] = x1; P[4] = y1; P[5] = g1; P[6] = x2; P[7] = y2; P[8] = g2;
      let m = 3, src = P, dst = Q2;
      if (lv > lo) { m = clip(src, m, dst, lv, +1); const t = src; src = dst; dst = t; }
      if (lv < hi) { m = clip(src, m, dst, lv + 1, -1); const t = src; src = dst; dst = t; }
      for (let k = 1; k + 1 < m; k++) emitTri(src[0], src[1], src[k * 3], src[k * 3 + 1], src[(k + 1) * 3], src[(k + 1) * 3 + 1], lv, src[2], src[k * 3 + 2], src[(k + 1) * 3 + 2]);
    }
    // gradient of the linear interpolant -> outward (downhill) wall normal
    const ex1 = x1 - x0, ey1 = y1 - y0, ex2 = x2 - x0, ey2 = y2 - y0, dg1 = g1 - g0, dg2 = g2 - g0;
    const det = ex1 * ey2 - ex2 * ey1;
    let gx = (dg1 * ey2 - dg2 * ey1) / det, gy = (ex1 * dg2 - ex2 * dg1) / det;
    const gl_ = Math.hypot(gx, gy) || 1; gx /= gl_; gy /= gl_;
    for (let lv = lo + 1; lv <= hi; lv++) {
      // two crossing points of g = lv on the triangle edges
      let c = 0, ax = 0, ay = 0, bx = 0, by = 0;
      const E3 = [[x0, y0, g0, x1, y1, g1], [x1, y1, g1, x2, y2, g2], [x2, y2, g2, x0, y0, g0]];
      for (const e of E3) {
        if ((e[2] < lv) !== (e[5] < lv)) {
          cross(e[0], e[1], e[2], e[3], e[4], e[5], lv);
          const px = CX, py = CY;
          if (c === 0) { ax = px; ay = py; } else { bx = px; by = py; }
          c++;
        }
      }
      if (c < 2) continue;
      emitWall(ax, ay, bx, by, lv - 1, lv, -gx, -gy);
      segs.need(5); const s = segs.a; let n = segs.n;
      s[n++] = ax; s[n++] = -ay; s[n++] = bx; s[n++] = -by; s[n++] = lv; segs.n = n;
    }
  }
  // average wall normals across segments that share an endpoint (removes faceting on curved walls)
  const acc = new Map();
  function smoothWallNormals() {
    acc.clear();
    const a = verts.a, n = verts.n;
    const key = (i) => Math.round(a[i] * 2e5) + ',' + Math.round(a[i + 1] * 2e5) + ',' + a[i + 3];
    for (let i = 0; i < n; i += 8) {
      if (a[i + 5] === 0 && a[i + 6] === 0) continue;
      const k = key(i); let v = acc.get(k); if (!v) { v = [0, 0]; acc.set(k, v); }
      v[0] += a[i + 5]; v[1] += a[i + 6];
    }
    for (let i = 0; i < n; i += 8) {
      if (a[i + 5] === 0 && a[i + 6] === 0) continue;
      const v = acc.get(key(i)), l = Math.hypot(v[0], v[1]) || 1;
      a[i + 5] = v[0] / l; a[i + 6] = v[1] / l;
    }
  }
  /* G: field in level units on the shared grid. sub: grid stride (1 = full res). */
  function build(G, L, sub = 1) {
    verts.reset(); segs.reset(); runs.reset();
    const nx = Math.floor((GX - 1) / sub) + 1, ny = Math.floor((GY - 1) / sub) + 1;
    const X = (i) => -MW + (i * sub + 0.5) * DX, Y = (j) => -1 + (j * sub + 0.5) * DY;
    const val = (i, j) => G[(j * sub) * GX + i * sub] + 1e-4;
    for (let j = 0; j < ny - 1; j++) {
      let runStart = -1, runLv = -1;
      const y0 = Y(j), y1 = Y(j + 1);
      const flush = (iEnd) => {
        if (runStart >= 0) {
          const e = 0.35 * DX, xa = X(runStart) - e, xb = X(iEnd) + e, ya = y0 - e, yb = y1 + e, gm = runLv + 0.5, lv = runLv;
          runs.need(48); const a = runs.a; let n = runs.n;
          for (const [x, y] of [[xa, ya], [xb, ya], [xb, yb], [xa, ya], [xb, yb], [xa, yb]]) { a[n++] = x; a[n++] = -y; a[n++] = lv; a[n++] = lv; a[n++] = 0; a[n++] = 0; a[n++] = 0; a[n++] = gm; }
          runs.n = n;
        }
        runStart = -1; runLv = -1;
      };
      for (let i = 0; i < nx - 1; i++) {
        const ga = val(i, j), gb = val(i + 1, j), gc = val(i + 1, j + 1), gd = val(i, j + 1);
        const mn = Math.min(ga, gb, gc, gd), mx = Math.max(ga, gb, gc, gd);
        const lo = clamp(Math.floor(mn), 0, L), hi = clamp(Math.floor(mx), 0, L);
        if (lo === hi && (lo === 0 || mn - lo > 0.12) && (lo === L || lo + 1 - mx > 0.12)) {
          if (runStart >= 0 && runLv === lo) continue;
          flush(i); runStart = i; runLv = lo; continue;
        }
        flush(i);
        const xa = X(i), xb = X(i + 1);
        tri(xa, y0, ga, xb, y0, gb, xb, y1, gc, L);
        tri(xa, y0, ga, xb, y1, gc, xa, y1, gd, L);
      }
      flush(nx - 1);
    }
    smoothWallNormals();
    const nTri = verts.n / 8;
    verts.need(runs.n); verts.a.set(runs.a.subarray(0, runs.n), verts.n); verts.n += runs.n;   // runs appended last
    return { verts: verts.view(), segs: segs.view(), nv: verts.n / 8, ns: segs.n / 5, nTri };
  }
  return { build };
}

/* contour polylines of one level along a horizontal section, used by the interface */
function sectionProfile(G, y, n = 600) {
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = -MW + (i / (n - 1)) * 2 * MW; out[i] = gridSample(G, x, y); }
  return out;
}

/* ---------------- 1. FIELD PLANE: lines as analytic level sets ---------------- */
const FIELD_VS = `#version 300 es
in vec2 aPos;
uniform mat4 uVP;
uniform vec4 uWhipFrame;   // c.xy, dir.xy  (plan coords)
uniform vec4 uPulse[4];    // pos, ampV, ampY, sigma
uniform vec4 uSheet;       // amp, wavelength, phase, along-decay
out vec3 vW;
void main(){
  vec2 q = vec2(aPos.x, -aPos.y);
  float s = dot(q - uWhipFrame.xy, uWhipFrame.zw);
  float n = dot(q - uWhipFrame.xy, vec2(-uWhipFrame.w, uWhipFrame.z));
  float y = 0.;
  for (int i = 0; i < 4; i++) { float x = (s - uPulse[i].x) / uPulse[i].w; y += uPulse[i].z * exp(-x * x) * exp(-n * n * 0.35); }
  y += uSheet.x * sin(6.2831853 * s / uSheet.y - uSheet.z) * exp(-abs(s) * uSheet.w);
  vW = vec3(aPos.x, y, aPos.y);
  gl_Position = uVP * vec4(vW, 1.);
}`;

const FIELD_FS = `#version 300 es
precision highp float;
in vec3 vW;
out vec4 oC;
uniform vec3 uBg;
uniform vec4 uA0, uA1, uA2, uA3, uA4, uB0, uB1, uB2, uB3, uB4;
// X0: c.xy dir.xy | X1: W m0 f mode | X2: sp invS v0 hwPx | X3: rgb alpha | X4: hwWorld gapPx idxBoost idxEvery
uniform vec4 uPulse[4]; uniform vec4 uSag; uniform vec4 uWhipFrame;
uniform vec4 uWeave;              // dir.xy, front, mode (0 A-top, 1 parity behind front, 2 B-top)
uniform sampler2D uTerr; uniform vec4 uMapRect; uniform float uK; uniform float uKoff;
uniform sampler2D uSig; uniform vec4 uSigP; uniform vec4 uSigQ;
// SigP: amount stretch split blur | SigQ: phase duty morph wipeY
uniform sampler2D uTit; uniform vec4 uTitP; uniform vec4 uTitQ; uniform vec4 uTitR;
// TitP: maskB stretch open fill | TitQ: ringAlpha ringSp ringDelta ringCount | TitR: ringW 0 0 0
uniform float uSweep; uniform float uInside;
uniform vec3 uRingCol;
uniform vec3 uEye; uniform vec2 uFog;

float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
float whipD(float s) {
  float d = 0.;
  for (int i = 0; i < 4; i++) { float x = (s - uPulse[i].x) / uPulse[i].w; d += uPulse[i].y * exp(-x * x); }
  float sl = s / uSag.y; d -= uSag.x * max(0., 1. - sl * sl);
  return d;
}
vec2 subdiv(float v, float Wd, float m0, float f) {
  float cells = exp2(m0), cw = Wd / cells;
  float u = (v + Wd * .5) / cw;
  float cell = floor(u), cu = fract(u) - .5, o = f * .25;
  float d1 = abs(cu - o), d2 = abs(cu + o);
  float side = d1 < d2 ? 1. : 0.;
  float inside = (u >= 0. && u < cells) ? 1. : 0.;
  return vec2(inside > .5 ? min(d1, d2) * cw : 1e3, cell * 2. + side);
}
void main() {
  vec2 q = vec2(vW.x, -vW.z);
  float pw = sqrt(abs(dFdx(q.x) * dFdy(q.y) - dFdx(q.y) * dFdy(q.x)));
  float sW = dot(q - uWhipFrame.xy, uWhipFrame.zw);
  vec2 nW = vec2(-uWhipFrame.w, uWhipFrame.z);
  float wd = whipD(sW);
  vec2 nA = vec2(-uA0.w, uA0.z), nB = vec2(-uB0.w, uB0.z);
  float vA = dot(q - uA0.xy, nA) - wd * dot(nW, nA);
  float vB = dot(q - uB0.xy, nB) - wd * dot(nW, nB);
  vec2 tuv = (q - uMapRect.xy) / uMapRect.zw;
  float hT = texture(uTerr, tuv).r;

  float FB0 = (vB - uB2.z) * uB2.y / uB2.x;
  float strip = floor(FB0 + .5);
  float par = mod(strip, 2.) * 2. - 1.;
  vec2 lq = vec2(q.x / uSigP.y + par * uSigP.z, q.y);
  float sdS = texture(uSig, (lq - uMapRect.xy) / uMapRect.zw).r;
  float aaS = pw * .8 / uSigP.y + uSigP.w;
  float LS = (1. - smoothstep(-aaS, aaS, sdS)) * uSigP.x * step(uSigQ.w, q.y);
  float phiB = LS * uSigQ.x * (1. - uSigQ.z) + uK * hT + uKoff;
  float FB = FB0 + phiB;
  float FA = (vA - uA2.z) * uA2.y / uA2.x;

  float sdT0 = texture(uTit, tuv).r;
  float aaT = pw * .8;
  float LT = 1. - smoothstep(-aaT, aaT, sdT0 - uTitP.w);
  if (uTitP.y > 1e-4) {            // directional smear: horizontal running max of the letter mask
    for (int k = -8; k <= 8; k++) {
      vec2 sq = q + vec2(float(k) / 8. * uTitP.y, 0.);
      float s = textureLod(uTit, (sq - uMapRect.xy) / uMapRect.zw, 0.).r - uTitP.w;
      LT = max(LT, 1. - smoothstep(-aaT, aaT, s));
    }
  }
  float ringF = (sdT0 - uTitQ.z) / uTitQ.y;

  float gvA = length(vec2(dFdx(vA), dFdy(vA))), gvB = length(vec2(dFdx(vB), dFdy(vB)));
  float gFA = length(vec2(dFdx(FA), dFdy(FA))), gFB = length(vec2(dFdx(FB), dFdy(FB)));
  float gR = length(vec2(dFdx(ringF), dFdy(ringF)));

  // family A
  float dA, iA, spA;
  if (uA1.w < .5) { vec2 s = subdiv(vA, uA1.x, uA1.y, uA1.z); dA = s.x / max(gvA, 1e-7); iA = s.y; spA = 1e3; }
  else { dA = abs(fract(FA + .5) - .5) / max(gFA, 1e-7); iA = floor(FA + .5); spA = 1. / max(gFA, 1e-7); }
  float wA = max(2. * uA2.w, 2. * uA4.x / max(gvA, 1e-7));
  float mA = (uA1.w > .5 && uA1.x > 0.) ? step(abs(vA), uA1.x * .5) : 1.;
  float cA = cover(dA, wA) * mA;
  cA = mix(cA, min(wA / spA, 1.), smoothstep(3., 1.4, spA));

  // family B
  float dB, iB, spB;
  if (uB1.w < .5) { vec2 s = subdiv(vB, uB1.x, uB1.y, uB1.z); dB = s.x / max(gvB, 1e-7); iB = s.y; spB = 1e3; }
  else { dB = abs(fract(FB + .5) - .5) / max(gFB, 1e-7); iB = floor(FB + .5); spB = 1. / max(gFB, 1e-7); }
  float wB = max(2. * uB2.w, 2. * uB4.x / max(gvB, 1e-7));
  float isIdx = abs(mod(iB, uB4.w)) < .5 ? 1. : 0.;
  float sweepM = 1. - smoothstep(uSweep - .03, uSweep + .03, q.x);
  wB *= mix(1., uB4.z, isIdx * sweepM);
  wB += LS * uSigQ.y * min(spB, 60.) * (1. - uSigQ.z);
  wB = mix(wB, mix(spB + 1.5, wB, uTitP.z), uTitP.x);
  float mB = ((uB1.w > .5 && uB1.x > 0.) ? step(abs(vB), uB1.x * .5) : 1.) * mix(1., LT, uTitP.x);
  if (uInside > .5 && uK > 0.) dB = abs(fract(FB) / max(gFB, 1e-7) - wB * .5);
  float cB = cover(dB, wB) * mB;
  cB = mix(cB, min(wB / spB, 1.), smoothstep(3., 1.4, spB));

  // rings around the title letters (level sets of the title distance field)
  float iR = floor(ringF + .5);
  float dR = abs(ringF - iR) / max(gR, 1e-7);
  if (uInside > .5) { iR = ceil(ringF); dR = abs((iR - ringF) / max(gR, 1e-7) - uTitR.x * .5); }
  float cR = cover(dR, uTitR.x) * step(.5, iR) * step(iR, uTitQ.w + .5) * uTitQ.x;
  cR *= smoothstep(0., pw * 1.5, sdT0);

  bool aTop;
  if (uWeave.w < .5) aTop = true;
  else if (uWeave.w < 1.5) { float behind = step(dot(q, uWeave.xy), uWeave.z); aTop = behind * mod(iA + iB, 2.) < .5; }
  else aTop = false;
  float gA = cover(dA, wA + 2. * uA4.y) * mA, gB = cover(dB, wB + 2. * uB4.y) * mB;

  float fog = 1. - smoothstep(uFog.x, uFog.y, length(vW - uEye));
  cA *= fog; cB *= fog; cR *= fog;
  vec3 col = uBg;
  col = mix(col, uRingCol, cR);
  if (aTop) { col = mix(col, uB3.rgb, cB * uB3.a * (1. - gA * uA3.a)); col = mix(col, uA3.rgb, cA * uA3.a); }
  else { col = mix(col, uA3.rgb, cA * uA3.a * (1. - gB * uB3.a)); col = mix(col, uB3.rgb, cB * uB3.a); }
  oC = vec4(col, 1.);
}`;

const FieldPlane = (() => {
  let prog, vao, count;
  function init() {
    prog = Program(FIELD_VS, FIELD_FS);
    const N = 240, S = 7;                       // grid over [-S,S]^2
    const v = new Float32Array((N + 1) * (N + 1) * 2);
    let k = 0;
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) { v[k++] = -S + (2 * S * i) / N; v[k++] = -S + (2 * S * j) / N; }

    gl.uniform4fv(u('uPulse'), P);
    gl.uniform4f(u('uSag'), S.sag[0], S.sag[1], 0, 0);

/* ---------------- 2. TERRACES: isoband mesh, extruded per level ---------------- */
const TERR_VS = `#version 300 es
in vec2 aPos; in vec3 aLv; in vec2 aN; in float aG;
uniform mat4 uVP; uniform float uLift[64]; uniform vec4 uXf; // map transform: offset.xz, scale, yOffset
out vec3 vW; out vec2 vN; out float vT; out float vG; flat out float vLv; flat out float vKind;
void main(){
  vG = aG;
  float y = mix(uLift[int(aLv.x)], uLift[int(aLv.y)], aLv.z);
  vec2 p = aPos * uXf.z + uXf.xy;
  vW = vec3(p.x, y * uXf.z + uXf.w, p.y);
  vN = aN; vT = aLv.z; vLv = aLv.y;
  vKind = dot(aN, aN) > .01 ? 1. : 0.;
  gl_Position = uVP * vec4(vW, 1.);
}`;
const TERR_FS = `#version 300 es
precision highp float;
in vec3 vW; in vec2 vN; in float vT; in float vG; flat in float vLv; flat in float vKind;
out vec4 oC;
uniform vec3 uCapLo, uCapHi; uniform vec4 uTint;   // amount, gamma, topLevel, topBoost
uniform float uLmax;
uniform vec4 uLine;     // width px, index width px, index every, alpha
uniform vec3 uLineCol, uInk; uniform float uSkipLevel, uSkipAmt;
uniform vec2 uLight;
uniform vec3 uWallLit, uWallDark;
uniform vec4 uStrata;   // spacing(world), width px, alpha, 0
uniform vec4 uXf;
float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
void main(){
  vec3 col;
  float gg = length(vec2(dFdx(vG), dFdy(vG)));
  if (vKind < .5) {
    float h = vLv / uLmax;
    col = mix(uCapLo, uCapHi, pow(h, uTint.y) * uTint.x);
    if (vLv >= uTint.z - .5) col = mix(col, uCapHi, uTint.w);
    // contour line: the level set g = level, drawn just inside this cap's outer edge
    float la = uLine.w * (abs(vLv - uSkipLevel) < .5 ? 1. - uSkipAmt : 1.);
    if (vLv > .5 && la > 0.) {
      float w = abs(mod(vLv, uLine.z)) < .5 ? uLine.y : uLine.x;
      float d = (vG - vLv) / max(gg, 1e-6);
      float lum = dot(col, vec3(.299, .587, .114));
      vec3 lc = mix(uLineCol, uInk, smoothstep(.42, .62, lum));
      col = mix(col, lc, cover(abs(d - w * .5), w) * la);
    }
  } else {
    float lam = dot(normalize(vN), uLight);
    col = mix(uWallDark, uWallLit, smoothstep(-.4, 1., lam));
    col *= mix(.62, 1., vT);
    float f = (vW.y - uXf.w) / uXf.z / uStrata.x;
    float g = length(vec2(dFdx(f), dFdy(f)));
    float d = abs(fract(f + .5) - .5) / max(g, 1e-6);
    col = mix(col, col * .45, cover(d, uStrata.y) * uStrata.z * smoothstep(.6, 2., 1. / max(g, 1e-6)));
  }
  oC = vec4(col, 1.);
}`;
const TERRL_VS = `#version 300 es
in vec2 aC;                // corner: along (0|1), side (-1|1)
in vec4 aSeg; in float aLvl;
uniform mat4 uVP; uniform vec2 uRes; uniform float uLift[64]; uniform vec4 uXf;
uniform float uW, uWIdx, uEvery, uBias;
out float vD; flat out float vWd; flat out float vLv;
void main(){
  float y = uLift[int(aLvl)] * uXf.z + uXf.w;
  vec3 p0 = vec3(aSeg.xy * uXf.z + uXf.xy, y).xzy, p1 = vec3(aSeg.zw * uXf.z + uXf.xy, y).xzy;
  vec4 c0 = uVP * vec4(p0, 1.), c1 = uVP * vec4(p1, 1.);
  float wd = abs(mod(aLvl, uEvery)) < .5 ? uWIdx : uW;
  vec2 s0 = c0.xy / c0.w * .5 * uRes, s1 = c1.xy / c1.w * .5 * uRes;
  vec2 d = s1 - s0; float L = length(d); d = L > 1e-5 ? d / L : vec2(1., 0.);
  vec2 n = vec2(-d.y, d.x);
  float hw = wd * .5 + 1.;
  vec4 c = mix(c0, c1, aC.x);
  vec2 off = n * aC.y * hw + d * (aC.x * 2. - 1.) * hw * .5;
  c.xy += off / (.5 * uRes) * c.w;
  c.z -= uBias * c.w;
  gl_Position = c; vD = aC.y * hw; vWd = wd; vLv = aLvl;
}`;
const TERRL_FS = `#version 300 es
precision highp float;
in float vD; flat in float vWd; flat in float vLv;
out vec4 oC;
uniform vec4 uCol; uniform vec4 uColIdx; uniform float uEvery;
uniform vec3 uCapLo, uCapHi; uniform vec4 uTint; uniform float uLmax; uniform vec3 uInk;
float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
void main(){
  vec4 c = abs(mod(vLv, uEvery)) < .5 ? uColIdx : uCol;
  // contrast against the cap this contour bounds
  float tnt = pow(vLv / uLmax, uTint.y) * uTint.x;
  if (vLv >= uTint.z - .5) tnt = mix(tnt, 1., uTint.w);
  vec3 cap = mix(uCapLo, uCapHi, tnt);
  float lum = dot(cap, vec3(.299, .587, .114));
  c.rgb = mix(c.rgb, uInk, smoothstep(.42, .62, lum));
  float a = cover(abs(vD), vWd) * c.a;
  if (a < .003) discard;
  oC = vec4(c.rgb, a);
}`;

const Terraces = (() => {
  let prog, lprog, vao, vbo, lvao, lbo, cornerBuf, nv = 0, ns = 0, nTri = 0;
  function init() {
    prog = Program(TERR_VS, TERR_FS);
    lprog = Program(TERRL_VS, TERRL_FS);
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    const st = 32;
    let l;
    l = prog.a('aPos'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, st, 0);
    l = prog.a('aLv'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, st, 8);
    l = prog.a('aN'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, st, 20);
    l = prog.a('aG'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 1, gl.FLOAT, false, st, 28);
    gl.bindVertexArray(null);
    lvao = gl.createVertexArray(); gl.bindVertexArray(lvao);
    cornerBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 1, -1, 0, 1, 1, 1]), gl.STATIC_DRAW);
    l = lprog.a('aC'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
    lbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, lbo);
    l = lprog.a('aSeg'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 4, gl.FLOAT, false, 20, 0); gl.vertexAttribDivisor(l, 1);
    l = lprog.a('aLvl'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 1, gl.FLOAT, false, 20, 16); gl.vertexAttribDivisor(l, 1);
    gl.bindVertexArray(null);
  }
  let lastKey = null;
  function upload(mesh, key) {
    if (key !== undefined && key === lastKey) return;
    lastKey = key;
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, mesh.verts, gl.DYNAMIC_DRAW); nv = mesh.nv; nTri = mesh.nTri ?? mesh.nv;
    gl.bindBuffer(gl.ARRAY_BUFFER, lbo); gl.bufferData(gl.ARRAY_BUFFER, mesh.segs, gl.DYNAMIC_DRAW); ns = mesh.ns;
  }
  function liftArray(T) { const a = new Float32Array(64); for (let i = 0; i < 64; i++) a[i] = T.lift(i); return a; }
  function draw(cam, T) {
    const lift = liftArray(T);
    const xf = T.xf || [0, 0, 1, 0];
    prog.use(); let u = prog.u;
    gl.uniformMatrix4fv(u('uVP'), false, cam.vp);
    gl.uniform1fv(u('uLift'), lift);
    gl.uniform4fv(u('uXf'), xf);
    gl.uniform3fv(u('uCapLo'), T.capLo); gl.uniform3fv(u('uCapHi'), T.capHi);
    gl.uniform4fv(u('uTint'), T.tint);
    gl.uniform1f(u('uLmax'), T.L);
    gl.uniform2fv(u('uLight'), T.light);
    gl.uniform3fv(u('uWallLit'), T.wallLit); gl.uniform3fv(u('uWallDark'), T.wallDark);
    gl.uniform4fv(u('uStrata'), [T.strata[0], T.strata[1] * PX, T.strata[2], 0]);
    gl.uniform4f(u('uLine'), T.lineW * PX, T.lineWIdx * PX, T.every, T.lineAlpha);
    gl.uniform3fv(u('uLineCol'), T.lineCol); gl.uniform3fv(u('uInk'), T.lineInk || INK); gl.uniform1f(u('uSkipLevel'), T.skipLevel ?? -9); gl.uniform1f(u('uSkipAmt'), T.skipAmt ?? 1);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, nTri);
    // merged interior runs: pushed back in depth so exact geometry always wins; they only fill sub-pixel cracks
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.0, 4.0);
    gl.drawArrays(gl.TRIANGLES, nTri, nv - nTri);
    gl.disable(gl.POLYGON_OFFSET_FILL);
    gl.bindVertexArray(null);
    if (T.segLines && T.lineAlpha > 0.001 && ns > 0) {
      lprog.use(); u = lprog.u;
      gl.uniformMatrix4fv(u('uVP'), false, cam.vp);
      gl.uniform2f(u('uRes'), W, H);
      gl.uniform1fv(u('uLift'), lift);
      gl.uniform4fv(u('uXf'), xf);
      gl.uniform1f(u('uW'), T.lineW * PX); gl.uniform1f(u('uWIdx'), T.lineWIdx * PX); gl.uniform1f(u('uEvery'), T.every);
      gl.uniform1f(u('uBias'), T.bias || 0.0004);
      gl.uniform4f(u('uCol'), T.lineCol[0], T.lineCol[1], T.lineCol[2], T.lineAlpha);
      gl.uniform4f(u('uColIdx'), T.lineColIdx[0], T.lineColIdx[1], T.lineColIdx[2], T.lineAlpha);
      gl.uniform3fv(u('uCapLo'), T.capLo); gl.uniform3fv(u('uCapHi'), T.capHi); gl.uniform4fv(u('uTint'), T.tint);
      gl.uniform1f(u('uLmax'), T.L); gl.uniform3fv(u('uInk'), T.lineInk || INK);
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
      gl.bindVertexArray(lvao);
      gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, ns);
      gl.bindVertexArray(null);
      gl.depthMask(true); gl.disable(gl.BLEND);
    }

  return { init, upload, draw };
})();

/* ---------------- 3. LINES: instanced world-space segments, AA in screen space ---------------- */
const LINE_VS = `#version 300 es
in vec2 aC;
in vec3 aP0; in vec3 aP1; in vec4 aCol; in vec2 aWD;   // width px, dash-phase(unused<0)
uniform mat4 uVP; uniform vec2 uRes; uniform float uBias;
out float vD; out vec4 vCol; flat out float vWd;
void main(){
  vec4 c0 = uVP * vec4(aP0, 1.), c1 = uVP * vec4(aP1, 1.);
  // clip against near plane in clip space
  float e = 1e-4;
  if (c0.w < e && c1.w < e) { gl_Position = vec4(2., 2., 2., 1.); vD = 0.; vCol = vec4(0.); vWd = 0.; return; }
  if (c0.w < e) c0 = mix(c0, c1, (e - c0.w) / (c1.w - c0.w));
  if (c1.w < e) c1 = mix(c1, c0, (e - c1.w) / (c0.w - c1.w));
  vec2 s0 = c0.xy / c0.w * .5 * uRes, s1 = c1.xy / c1.w * .5 * uRes;
  vec2 d = s1 - s0; float L = length(d); d = L > 1e-5 ? d / L : vec2(1., 0.);
  vec2 n = vec2(-d.y, d.x);
  float hw = aWD.x * .5 + 1.;
  vec4 c = mix(c0, c1, aC.x);
  vec2 off = n * aC.y * hw + d * (aC.x * 2. - 1.) * min(hw, aWD.x * .5 + .5);
  c.xy += off / (.5 * uRes) * c.w;
  c.z -= uBias * c.w;
  gl_Position = c; vD = aC.y * hw; vCol = aCol; vWd = aWD.x;
}`;
const LINE_FS = `#version 300 es
precision highp float;
in float vD; in vec4 vCol; flat in float vWd;
out vec4 oC;
float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
void main(){ float a = cover(abs(vD), vWd) * vCol.a; if (a < .003) discard; oC = vec4(vCol.rgb, a); }`;

const Lines = (() => {
  let prog, vao, buf, cbuf;
  const B = new FBuf(1 << 16);
  function init() {
    prog = Program(LINE_VS, LINE_FS);
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    cbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cbuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 1, -1, 0, 1, 1, 1]), gl.STATIC_DRAW);
    let l = prog.a('aC'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
    buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    const st = 48;
    const at = (n, sz, off) => { const l2 = prog.a(n); gl.enableVertexAttribArray(l2); gl.vertexAttribPointer(l2, sz, gl.FLOAT, false, st, off); gl.vertexAttribDivisor(l2, 1); };
    at('aP0', 3, 0); at('aP1', 3, 12); at('aCol', 4, 24); at('aWD', 2, 40);
    gl.bindVertexArray(null);
  }
  const begin = () => B.reset();
  // segment in world space; col = [r,g,b,a]; w in design px
  function seg(p0, p1, col, w) { B.push(p0[0], p0[1], p0[2], p1[0], p1[1], p1[2], col[0], col[1], col[2], col[3], w * PX, 0); }
  function poly(pts, col, w, closed = false) { for (let i = 0; i + 1 < pts.length; i++) seg(pts[i], pts[i + 1], col, w); if (closed && pts.length > 2) seg(pts[pts.length - 1], pts[0], col, w); }
  function flush(cam, depthTest = true, bias = 0.0006) {
    const n = B.n / 12; if (!n) return;
    prog.use(); const u = prog.u;
    gl.uniformMatrix4fv(u('uVP'), false, cam.vp); gl.uniform2f(u('uRes'), W, H); gl.uniform1f(u('uBias'), bias);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, B.view(), gl.DYNAMIC_DRAW);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    if (!depthTest) gl.disable(gl.DEPTH_TEST);
    gl.bindVertexArray(vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n); gl.bindVertexArray(null);
    gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST);
    B.reset();
  }
  return { init, begin, seg, poly, flush };
})();

/* ---------------- 4. FILLS: world-space or screen-space triangles ---------------- */
const FILL_VS = `#version 300 es
in vec3 aP; in vec4 aCol;
uniform mat4 uVP; uniform vec2 uRes; uniform float uScreen;
out vec4 vCol;
void main(){
  vCol = aCol;
  if (uScreen > .5) gl_Position = vec4(aP.x / uRes.x * 2. - 1., 1. - aP.y / uRes.y * 2., 0., 1.);
  else gl_Position = uVP * vec4(aP, 1.);
}`;
const FILL_FS = `#version 300 es
precision highp float; in vec4 vCol; out vec4 oC; void main(){ oC = vCol; }`;
const Fills = (() => {
  let prog, vao, buf;
  const B = new FBuf(1 << 14), BS = new FBuf(1 << 12);
  function init() {
    prog = Program(FILL_VS, FILL_FS);
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    let l = prog.a('aP'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 28, 0);
    l = prog.a('aCol'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 4, gl.FLOAT, false, 28, 12);
    gl.bindVertexArray(null);
  }
  function tri(a, b, c, col, screen = false) { const T = screen ? BS : B; for (const p of [a, b, c]) T.push(p[0], p[1], p[2] || 0, col[0], col[1], col[2], col[3]); }
  function quad(a, b, c, d, col, screen = false) { tri(a, b, c, col, screen); tri(a, c, d, col, screen); }
  function rectXZ(x0, z0, x1, z1, y, col) { quad([x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1], col); }
  function rectPx(x0, y0, x1, y1, col) { quad([x0 * PX, y0 * PX], [x1 * PX, y0 * PX], [x1 * PX, y1 * PX], [x0 * PX, y1 * PX], col, true); }
  function flush(cam, screenOnly = false) {
    prog.use(); const u = prog.u;
    gl.uniformMatrix4fv(u('uVP'), false, cam.vp); gl.uniform2f(u('uRes'), W, H);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(vao);
    if (!screenOnly && B.n) {
      gl.uniform1f(u('uScreen'), 0);

      gl.drawArrays(gl.TRIANGLES, 0, B.n / 7); B.reset();

    if (BS.n) {
      gl.disable(gl.DEPTH_TEST); gl.uniform1f(u('uScreen'), 1);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, BS.view(), gl.DYNAMIC_DRAW);
      gl.drawArrays(gl.TRIANGLES, 0, BS.n / 7); BS.reset(); gl.enable(gl.DEPTH_TEST);

  return { init, tri, quad, rectXZ, rectPx, flush };
})();

/* =====================================================================
   TEXT — SDF glyph atlas built at load time from the embedded Inter fonts.
   Kerning pairs are measured from the browser's shaping of the real font.
   ===================================================================== */
const TEXT_VS = `#version 300 es
in vec3 aP; in vec2 aUV; in vec4 aCol; in vec2 aL; in vec4 aClip;
uniform mat4 uVP; uniform vec2 uRes; uniform float uScreen;
out vec2 vUV; out vec4 vCol; out vec2 vL; flat out vec4 vClip;
void main(){
  vUV = aUV; vCol = aCol; vL = aL; vClip = aClip;
  if (uScreen > .5) gl_Position = vec4(aP.x / uRes.x * 2. - 1., 1. - aP.y / uRes.y * 2., 0., 1.);
  else gl_Position = uVP * vec4(aP, 1.);

const TEXT_FS = `#version 300 es
precision highp float;
in vec2 vUV; in vec4 vCol; in vec2 vL; flat in vec4 vClip;
uniform sampler2D uAtlas;
out vec4 oC;
void main(){
  if (vL.x < vClip.x || vL.y < vClip.y || vL.x > vClip.z || vL.y > vClip.w) discard;
  float d = texture(uAtlas, vUV).r;
  float w = max(fwidth(d) * .62, 1e-4);

const Text = (() => {
  const AW = 2048, AH = 2048;

  async function loadFonts() {

      { key: 'display', css: '900 {s}px "IDB"', em: 150, spread: 14, chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:/-—′+−×°%' },
      { key: 'text', css: '600 {s}px "IST"', em: 64, spread: 7, chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;/-–—′\'·×+−=()%°→' },
    ];

  const cam = camAt(t);
  gl.viewport(0, 0, W, H);
  gl.clearColor(INK[0], INK[1], INK[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  const useField = t < 6.0 || t >= 14.25;
  if (useField) {
    FieldPlane.draw(cam, fieldState(t), TEX);
  } else {
    const Lo = layoutAt(t);
    const p0 = Lo.m2w(-MW, -1), p1 = Lo.m2w(MW, 1);
    Fills.rectXZ(SHEET[0], SHEET[1], SHEET[2], SHEET[3], -0.004, C4(PAPER));
    Fills.rectXZ(p0[0], p0[1], p1[0], p1[1], -0.0015, C4(INK));
    Fills.flush(cam);
    const climax = t >= 12.0;
    const T = climax ? climaxState(t) : terraceState(t);
    if (climax) { const [mesh, key] = climaxMesh(t); Terraces.upload(mesh, key); }
    else Terraces.upload(TERR.mesh, 'terrain');
    Terraces.draw(cam, T);
    Lines.begin();
    if (t < 8.0) Lines.poly(threadProfile(T, SP / 2), C4(ORANGE), 3.0);
    drawInterface(t, cam);
    Fills.flush(cam);
    Lines.flush(cam, true, 0.0012);
  }
  drawCaptions(t, PAPER);
  Text.flush(cam);
}

/* ---- audio.js ---- */
/* =====================================================================
   SOUNDTRACK — original composition, synthesized with OfflineAudioContext.
   120 BPM, 4/4, D minor. 15 s = 7 bars + 1/2 bar. 48 kHz stereo.
   Two identical cycles are rendered and the second is kept, so every tail
   that crosses 15.000 s wraps into the start: the loop is seamless.
   Harmony per bar: Dm9 | Dm9 | Bbmaj7 | Gm9 | Fmaj9 | A7sus4-A7 | Dm | Bbmaj9#11 (1/2)
   ===================================================================== */
window.renderSoundtrack = async (opts = {}) => {
  const SR = 48000, CYCLE = 15, NC = opts.verify ? 3 : 2, LEN = CYCLE * NC;
  const ctx = new OfflineAudioContext(2, SR * LEN, SR);
  const rnd = mulberry32(20261011);
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const B = (n) => n * 0.5;            // beat -> seconds
  const S16 = (bar, step) => bar * 2 + step * 0.125;

  // ---------------------------------------------------------- shared resources
  const noiseBuf = ctx.createBuffer(2, SR * 3, SR);
  for (let c = 0; c < 2; c++) { const d = noiseBuf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  const curve = (drive) => { const n = 2048, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(x * drive) / Math.tanh(drive); } return c; };
  function IR(sec, decay, seed) {
    const r = mulberry32(seed), b = ctx.createBuffer(2, Math.floor(SR * sec), SR);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) { const tt = i / SR; d[i] = (r() * 2 - 1) * Math.exp(-tt / decay) * (1 - Math.exp(-tt / 0.004)); } }
    return b;
  }
  const G = (v = 1) => { const g = ctx.createGain(); g.gain.value = v; return g; };

  // ---------------------------------------------------------- buses
  const master = G(0.9);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.12;
  master.connect(comp); comp.connect(ctx.destination);
  const verb = ctx.createConvolver(); verb.buffer = IR(2.4, 0.55, 99); const verbRet = G(0.32); verb.connect(verbRet); verbRet.connect(master);
  const room = ctx.createConvolver(); room.buffer = IR(0.6, 0.12, 7); const roomRet = G(0.22); room.connect(roomRet); roomRet.connect(master);
  const kickBus = G(0.95); kickBus.connect(master);
  const kickSat = ctx.createWaveShaper(); kickSat.curve = curve(1.8); kickSat.connect(kickBus);
  const drumBus = G(0.8); drumBus.connect(master);
  const duck = G(1); duck.connect(master);                 // everything tonal is side-chained to the kick
  const bassBus = G(0.62); const bassSat = ctx.createWaveShaper(); bassSat.curve = curve(2.6); bassSat.oversample = '2x';
  bassBus.connect(bassSat); bassSat.connect(duck);
  const synthBus = G(0.5); synthBus.connect(duck);
  const subBus = G(0.75); subBus.connect(duck);
  const send = (node, bus, amt) => { const g = G(amt); node.connect(g); g.connect(bus); };

  // noise read offset is a pure function of the event's position in the cycle -> both cycles are sample-identical
  function noise(t, dur) {
    const tl = ((t % CYCLE) + CYCLE) % CYCLE, h = Math.sin(tl * 12.9898 + 0.31) * 43758.5453;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.start(t, (h - Math.floor(h)) * 1.5, dur + 0.05); return s;
  }
  function env(param, t, a, peak, d, floor = 0.0001) {
    param.setValueAtTime(0, t); param.linearRampToValueAtTime(peak, t + a);
    param.exponentialRampToValueAtTime(floor, t + a + d); param.linearRampToValueAtTime(0, t + a + d + 0.01);
  }
  function pan(node, p) { const n = ctx.createStereoPanner(); n.pan.value = p; node.connect(n); return n; }

  // ---------------------------------------------------------- instruments
  function kick(t, big = 0) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(180 + big * 40, t);
    o.frequency.exponentialRampToValueAtTime(54, t + 0.042);
    o.frequency.exponentialRampToValueAtTime(41 - big * 4, t + 0.32 + big * 0.3);
    const g = G(0); env(g.gain, t, 0.0015, 0.95, 0.40 + big * 0.45);
    o.connect(g); g.connect(kickSat); o.start(t); o.stop(t + 1.0 + big * 0.5);
    const n = noise(t, 0.02), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
    const gn = G(0); env(gn.gain, t, 0.0008, 0.35, 0.012); n.connect(hp); hp.connect(gn); gn.connect(kickBus);
    // side-chain duck of tonal bus
    duck.gain.setValueAtTime(0.32, t); duck.gain.setTargetAtTime(1, t + 0.012, 0.065 + big * 0.03);
  }
  function clap(t, vel = 1, wet = 0.22) {
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1350; bp.Q.value = 0.9;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 450;
    const g = G(0); bp.connect(hp); hp.connect(g);
    const out = pan(g, 0.04);
    out.connect(drumBus); send(out, verb, wet); send(out, room, 0.5);
    for (const [dt, a, d] of [[0, 0.7, 0.008], [0.0095, 0.75, 0.008], [0.0195, 1, 0.16]]) {
      const n = noise(t + dt, d + 0.02), gg = G(0); env(gg.gain, t + dt, 0.0006, a * vel, d); n.connect(gg); gg.connect(bp);
    }
    g.gain.value = 0.85;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(205, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.06);
    const go = G(0); env(go.gain, t, 0.001, 0.35 * vel, 0.08); o.connect(go); go.connect(drumBus); o.start(t); o.stop(t + 0.15);
  }
  function hat(t, vel, open = false, p = 0) {
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7200;
    const pk = ctx.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 10500; pk.gain.value = 6; pk.Q.value = 1.2;
    const g = G(0); env(g.gain, t, 0.0007, 0.42 * vel, open ? 0.17 : 0.028);
    const n = noise(t, open ? 0.25 : 0.06); n.connect(hp); hp.connect(pk); pk.connect(g);
    const out = pan(g, p); out.connect(drumBus); if (open) send(out, room, 0.4);
  }
  function tick(t, f = 3400, vel = 1, p = 0) {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = G(0); env(g.gain, t, 0.0005, 0.18 * vel, 0.006); o.connect(g); pan(g, p).connect(drumBus); o.start(t); o.stop(t + 0.03);
  }
  function bass(t, dur, m, o = {}) {
    const f = mtof(m), cut0 = o.cut0 || 1800, cut1 = o.cut1 || 260, vel = o.vel || 1;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = o.q || 7;
    lp.frequency.setValueAtTime(cut0, t); lp.frequency.exponentialRampToValueAtTime(cut1, t + Math.max(0.05, dur * 0.8));
    const g = G(0);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.5 * vel, t + 0.003);
    g.gain.setTargetAtTime(0.32 * vel, t + 0.01, 0.05); g.gain.setValueAtTime(0.32 * vel, t + dur - 0.012); g.gain.linearRampToValueAtTime(0, t + dur);
    for (const [type, det, lvl] of [['sawtooth', -7, 0.6], ['square', 6, 0.38], ['sawtooth', -1200, 0.5]]) {
      const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = f; osc.detune.value = det;
      if (o.glide) { osc.frequency.setValueAtTime(mtof(o.glide), t); osc.frequency.exponentialRampToValueAtTime(f, t + 0.06); }
      const gl = G(lvl); osc.connect(gl); gl.connect(lp); osc.start(t); osc.stop(t + dur + 0.02);
    }
    lp.connect(g); g.connect(bassBus);
  }
  function sub(t, dur, m, lvl = 0.6, dive = 0) {
    const o = ctx.createOscillator(); o.type = 'sine';
    if (dive) { o.frequency.setValueAtTime(mtof(m + dive), t); o.frequency.exponentialRampToValueAtTime(mtof(m), t + 0.18); }
    else o.frequency.value = mtof(m);
    const g = G(0); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(lvl, t + 0.012);
    g.gain.setValueAtTime(lvl, t + dur - 0.08); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(subBus); o.start(t); o.stop(t + dur + 0.02);
  }
  function pluck(t, m, vel = 1, p = 0, o = {}) {
    const f = mtof(m), dec = o.dec || 0.2;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = o.q || 4;
    lp.frequency.setValueAtTime(o.cut || 5200, t); lp.frequency.exponentialRampToValueAtTime(o.cutEnd || 700, t + dec);
    const g = G(0); env(g.gain, t, 0.0015, 0.32 * vel, dec);
    for (const [type, det] of [['sawtooth', -6], ['square', 7]]) {
      const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = f; osc.detune.value = det;
      if (o.bend) { osc.frequency.setValueAtTime(f * Math.pow(2, o.bend / 12), t); osc.frequency.exponentialRampToValueAtTime(f, t + (o.bendT || 0.05)); }
      osc.connect(lp); osc.start(t); osc.stop(t + dec + 0.05);
    }
    lp.connect(g); const out = pan(g, p); out.connect(synthBus); send(out, verb, o.wet ?? 0.25);
  }
  function stab(t, ms, dur, o = {}) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = o.q || 3;
    lp.frequency.setValueAtTime(o.cut0 || 6500, t); lp.frequency.exponentialRampToValueAtTime(o.cut1 || 900, t + dur * 0.9);
    const sat = ctx.createWaveShaper(); sat.curve = curve(o.drive || 1.6);
    const g = G(0); env(g.gain, t, o.att || 0.002, (o.vel || 1) * 0.16, dur);
    for (const m of ms) for (const [det, p] of [[-11, -0.5], [9, 0.5], [0, 0]]) {
      const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = mtof(m); osc.detune.value = det;
      if (o.bend) { osc.detune.setValueAtTime(det, t); osc.detune.linearRampToValueAtTime(det + o.bend * 100, t + dur); }
      const pn = ctx.createStereoPanner(); pn.pan.value = p * (o.width ?? 0.7);
      osc.connect(pn); pn.connect(lp); osc.start(t); osc.stop(t + dur + 0.05);
    }
    lp.connect(sat); sat.connect(g); g.connect(synthBus); send(g, verb, o.wet ?? 0.3);
    return g;
  }
  // interference pad: each voice is a pair of saws whose beat frequency follows the moire angle
  function interference(t0, t1, ms, beatAt) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = 1.5;
    const g = G(0); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.07, t0 + 0.02);
    g.gain.setValueAtTime(0.07, t1 - 0.06); g.gain.linearRampToValueAtTime(0, t1);
    lp.frequency.setValueAtTime(900, t0); lp.frequency.exponentialRampToValueAtTime(3800, t1);
    ms.forEach((m, i) => {
      const f = mtof(m);
      const a = ctx.createOscillator(); a.type = 'sawtooth'; a.frequency.value = f;
      const b = ctx.createOscillator(); b.type = 'sawtooth';
      b.frequency.setValueAtTime(f + beatAt(0), t0);
      for (let k = 1; k <= 14; k++) b.frequency.setTargetAtTime(f + beatAt(k), t0 + k * 0.125, 0.012);
      const pa = ctx.createStereoPanner(); pa.pan.value = -0.6 + i * 0.3; const pb = ctx.createStereoPanner(); pb.pan.value = 0.6 - i * 0.3;
      a.connect(pa); b.connect(pb); pa.connect(lp); pb.connect(lp);
      a.start(t0); b.start(t0); a.stop(t1 + 0.02); b.stop(t1 + 0.02);
    });
    lp.connect(g); g.connect(synthBus); send(g, verb, 0.2);
  }
  function pad(t, dur, ms, o = {}) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.cut || 2200; lp.Q.value = 0.8;
    const g = G(0); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.vel || 0.05, t + (o.att || 0.03));
    g.gain.setValueAtTime(o.vel || 0.05, t + dur - (o.rel || 0.2)); g.gain.linearRampToValueAtTime(0, t + dur);
    ms.forEach((m, i) => { for (const det of [-9, 8]) {
      const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = mtof(m); osc.detune.value = det;
      const pn = ctx.createStereoPanner(); pn.pan.value = (det < 0 ? -1 : 1) * (0.3 + 0.1 * i);
      osc.connect(pn); pn.connect(lp); osc.start(t); osc.stop(t + dur + 0.02);
    } });
    lp.connect(g); g.connect(synthBus); send(g, verb, o.wet ?? 0.45);
  }
  function riser(t0, t1, lvl = 0.25) {
    const n = noise(t0, t1 - t0), bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.2;
    bp.frequency.setValueAtTime(350, t0); bp.frequency.exponentialRampToValueAtTime(9000, t1);
    const g = G(0); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lvl, t1 - 0.004); g.gain.linearRampToValueAtTime(0, t1);
    n.connect(bp); bp.connect(g); g.connect(drumBus); send(g, verb, 0.3);
  }
  function crash(t, lvl = 0.35, dur = 2.4) {
    const n = noise(t, dur), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4200;
    const g = G(0); env(g.gain, t, 0.001, lvl, dur); n.connect(hp); hp.connect(g); g.connect(drumBus); send(g, verb, 0.4);
  }
  function swell(t0, t1, lvl = 0.3) {     // reverse cymbal into the downbeat
    const n = noise(t0, t1 - t0), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.setValueAtTime(2500, t0); hp.frequency.exponentialRampToValueAtTime(7000, t1);
    const g = G(0); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lvl, t1 - 0.003); g.gain.linearRampToValueAtTime(0, t1);
    n.connect(hp); hp.connect(g); g.connect(drumBus);
  }

  // ---------------------------------------------------------- the score
  const DM9 = [50, 53, 57, 60, 64], BBM7 = [46, 50, 53, 57], GM9 = [43, 46, 50, 53, 57], FM9 = [41, 45, 48, 52, 55];
  const A7S = [45, 50, 52, 55], A7 = [45, 49, 52, 55], DMC = [50, 57, 62, 65, 69], BBM9 = [46, 53, 57, 60, 64];
  const ROOT = [38, 38, 34, 31, 41, 33, 38, 34];

  function compose(T) {
    // kick on every beat (30); section downbeats hit harder
    for (let b = 0; b < 30; b++) kick(T + B(b), [0, 12, 24, 28].includes(b) ? 1 : 0);
    // clap on beats 2 & 4 of every bar (and the final upbeat)
    for (let b = 1; b < 30; b += 2) clap(T + B(b), b === 29 ? 1.1 : 1, b === 23 ? 0.35 : 0.22);
    // hats: 16ths with groove; open hats on the off-8ths from bar 3; roll at 1.5 and 11.5
    for (let s = 0; s < 120; s++) {
      const t = T + s * 0.125, inBeat = s % 4, bar = Math.floor(s / 16);
      if (bar === 7 && inBeat === 0) continue;
      const v = [0.45, 0.22, 0.8, 0.3][inBeat] * (bar >= 6 ? 1.15 : 1);
      if (inBeat === 2 && bar >= 2 && bar !== 3) hat(t, 0.7, true, 0.25); else hat(t, v, false, inBeat % 2 ? -0.3 : 0.3);
    }
    for (let k = 0; k < 8; k++) hat(T + 1.5 + 0.0625 + k * 0.0625, 0.35 + k * 0.05, false, k % 2 ? 0.4 : -0.4);   // 32nd roll (densify)
    // ---- bar 1: the thread. a pluck snaps on the downbeat, then the note-rate doubles on every 16th (1>2>4>8)
    pluck(T + 0, 74, 1.2, 0, { bend: 7, bendT: 0.06, dec: 0.45, cut: 7000, wet: 0.35 });
    const arp = [74, 81, 77, 86, 74, 77, 81, 84];
    [[0.5, 1], [0.625, 2], [0.75, 4], [0.875, 8]].forEach(([t0, n]) => {
      for (let k = 0; k < n; k++) pluck(T + t0 + k * (0.125 / n), arp[(k + n) % arp.length] - (n > 4 ? 12 : 0), 0.75, (k % 2 ? 0.45 : -0.45), { dec: 0.12, cut: 4800 });
    });
    pluck(T + 1.0, 81, 0.9, 0.35, { bend: -5, bendT: 0.18, dec: 0.5, wet: 0.4 });                 // the white thread swings out (a fifth above)
    // ---- bars 1-2 bass: off-beat pulse, then octave chatter
    for (let s = 0; s < 32; s++) {
      const bar = Math.floor(s / 16), st = s % 16, m = ROOT[bar];
      const on = bar === 0 ? [2, 3, 6, 7, 10, 11, 14, 15].includes(st) : st % 4 !== 0;
      if (on) bass(T + s * 0.125, 0.11, m + (bar === 1 && st % 4 === 3 ? 12 : 0), { cut0: bar ? 2400 : 1500, vel: st % 4 === 2 ? 1 : 0.8 });
    }
    // ---- bar 2: interference (beat rate halves with the moire angle), SIGNAL stab + stretch + stutter
    interference(T + 2.0, T + 3.95, [50, 57, 65], (k) => 8 * Math.pow(2, -k));
    stab(T + 2.5, DM9, 0.32, { vel: 1.1, cut0: 7000, cut1: 1200 });
    stab(T + 3.0, DM9, 0.24, { vel: 0.8, bend: -2, cut0: 4000, cut1: 600 });
    for (let k = 0; k < 4; k++) stab(T + 3.25 + k * 0.0625, DM9, 0.045, { vel: 0.55, cut0: 3000, cut1: 1500, wet: 0.1 });
    stab(T + 3.5, DM9, 0.4, { vel: 1.0, cut0: 6500, cut1: 500, wet: 0.45 });
    // ---- bar 3: contour arpeggio over Bbmaj7, filter opening as the rings close
    const arp3 = [58, 62, 65, 69, 72, 69, 65, 62];
    for (let s = 0; s < 16; s++) pluck(T + 4.0 + s * 0.125, arp3[s % 8], 0.6 + 0.4 * (s % 4 === 0), (s % 2 ? 0.35 : -0.35), { dec: 0.16, cut: 900 + 4500 * (s / 15), cutEnd: 500 });
    for (let s = 0; s < 16; s++) if (s % 4 !== 0) bass(T + 4.0 + s * 0.125, 0.11, ROOT[2] + ([7, 12, 0][s % 3]) * (s % 4 === 3 ? 1 : 0), { cut0: 1200 + 120 * s });
    riser(T + 5.25, T + 6.0, 0.16);
    // ---- bar 4: DIMENSIONAL BREAKTHROUGH - sub drop, wide Gm9, half-time bass, arp continues
    sub(T + 6.0, 1.95, 31, 0.7, 12);
    pad(T + 6.0, 1.95, GM9, { vel: 0.045, cut: 1600, att: 0.08, wet: 0.6 });
    crash(T + 6.0, 0.22, 1.8);
    for (const s of [3, 6, 7, 10, 11, 14, 15]) bass(T + 6.0 + s * 0.125, 0.1, 31 + (s > 9 ? 12 : 0), { cut0: 900, vel: 0.85 });
    const arp4 = [67, 70, 74, 77, 79, 77, 74, 70];
    for (let s = 0; s < 16; s += 2) pluck(T + 6.0 + s * 0.125 + 0.0625, arp4[(s / 2) % 8], 0.55, (s % 4 ? 0.5 : -0.5), { dec: 0.3, cut: 3500, wet: 0.55 });
    riser(T + 7.5, T + 8.0, 0.14);
    // ---- bar 5: SYSTEM - mechanical 16ths, ticks for each projection line, Fmaj9 plucks
    for (let s = 0; s < 16; s++) if (s % 4 !== 0) bass(T + 8.0 + s * 0.125, 0.07, ROOT[4] + (s % 4 === 2 ? 12 : 0), { cut0: 2600, cut1: 400, q: 9, vel: 0.85 });
    for (let k = 0; k < 8; k++) tick(T + 8.95 + k * 0.0625, 3000 + k * 180, 0.9, -0.6 + k * 0.17);
    for (let s = 0; s < 16; s++) tick(T + 8.0 + s * 0.125 + 0.0625, 5200, 0.35, s % 2 ? 0.5 : -0.5);
    for (const b of [16, 17, 18, 19]) stab(T + B(b) + 0.25, FM9, 0.12, { vel: 0.5, cut0: 3800, cut1: 1400, width: 1, wet: 0.2 });
    // the hook: rising three-note figure on the data points
    [[9.0, 77], [9.125, 81], [9.25, 84], [9.5, 81], [9.625, 84], [9.75, 88]].forEach(([tt, m]) => pluck(T + tt, m, 0.7, 0.2, { dec: 0.18, cut: 6000 }));
    // ---- bar 6: LIVING SYSTEM - A7sus4 -> A7, driving 16ths, riser + snare roll into the climax
    for (let s = 0; s < 16; s++) if (s % 4 !== 0) bass(T + 10.0 + s * 0.125, 0.1, ROOT[5] + (s % 4 === 3 ? 12 : 0), { cut0: 1500 + 260 * s, cut1: 380, vel: 0.9 });
    stab(T + 10.0, A7S, 0.2, { vel: 0.7, cut0: 4000, cut1: 1100 });
    stab(T + 11.0, A7, 0.2, { vel: 0.75, cut0: 4500, cut1: 1100 });
    for (let k = 0; k < 16; k++) tick(T + 10.0 + k * 0.125 + 0.0625, 4400 + (k % 4) * 300, 0.4, k % 2 ? 0.6 : -0.6);
    [[10.25, 81], [10.375, 84], [10.5, 88], [11.25, 81], [11.375, 85], [11.5, 88]].forEach(([tt, m]) => pluck(T + tt, m, 0.65, -0.2, { dec: 0.16, cut: 6500 }));
    riser(T + 11.0, T + 12.0, 0.3);
    for (let k = 0; k < 4; k++) clap(T + 11.5 + 0.125 * k + 0.0625, 0.45 + 0.1 * k, 0.15);
    for (let k = 0; k < 8; k++) clap(T + 11.75 + 0.03125 * k, 0.35 + 0.07 * k, 0.12);
    // ---- bar 7: THE CLIMAX - stabs on every beat, distorted 16ths, D minor with octaves, sub, crash
    crash(T + 12.0, 0.4, 2.2);
    sub(T + 12.0, 2.0, 26, 0.75, 12);
    [[12.0, 1.35, 0.5], [12.5, 1.0, 0.3], [13.0, 1.15, 0.36], [13.5, 1.0, 0.3]].forEach(([tt, v, d]) => stab(T + tt, DMC.concat([38]), d, { vel: v, drive: 2.4, cut0: 9000, cut1: 1200, width: 1, wet: 0.35 }));
    for (let s = 0; s < 32; s++) if (s % 4 !== 0) bass(T + 12.0 + s * 0.125, 0.1, ROOT[6] + (s % 4 === 2 ? 12 : 0) + (s >= 24 && s % 4 === 3 ? 3 : 0), { cut0: 3400, cut1: 520, q: 8, vel: 1.05 });
    [[12.25, 86], [12.375, 89], [12.5, 93], [13.25, 86], [13.375, 89], [13.5, 91], [13.75, 93]].forEach(([tt, m]) => pluck(T + tt, m, 0.75, 0.15, { dec: 0.2, cut: 7500, wet: 0.35 }));
    // ---- final half bar: IDENTITY - Bbmaj9#11, stutter into the merge, reverse swell into the loop
    pad(T + 14.0, 0.98, BBM9, { vel: 0.07, cut: 3200, att: 0.01, rel: 0.05, wet: 0.5 });
    stab(T + 14.0, BBM9, 0.42, { vel: 1.0, cut0: 8000, cut1: 1500, wet: 0.55 });
    sub(T + 14.0, 0.98, 34, 0.55);
    for (let k = 0; k < 4; k++) stab(T + 14.75 + k * 0.0625, BBM9.map((m) => m - 12 * (k > 1)), 0.04, { vel: 0.5 - k * 0.07, cut0: 3000, cut1: 2000, wet: 0.15 });
    swell(T + 14.5, T + 15.0, 0.26);
  }
  for (let c = 0; c < NC; c++) compose(c * CYCLE);

  const buf = await ctx.startRendering();
  if (opts.verify) {   // is cycle 3 a sample-exact continuation of cycle 2 in the same way cycle 2 follows cycle 1?
    const N = SR * CYCLE; let dHead = 0, dTail = 0;
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c);
      for (let i = 0; i < SR; i++) dHead = Math.max(dHead, Math.abs(d[2 * N + i] - d[N + i]));
      for (let i = 1; i <= SR; i++) dTail = Math.max(dTail, Math.abs(d[3 * N - i] - d[2 * N - i])); }
    return JSON.stringify({ maxDiffAfterSeam: dHead, maxDiffBeforeSeam: dTail });
  }
  // second cycle, peak-normalised to -1 dBFS, TPDF-dithered 16-bit PCM
  const n = SR * CYCLE, L = buf.getChannelData(0).subarray(n, 2 * n), R = buf.getChannelData(1).subarray(n, 2 * n);
  let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const gain = Math.pow(10, -1 / 20) / (peak || 1);
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); wstr(8, 'WAVE'); wstr(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, SR, true);
  out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); wstr(36, 'data'); out.setUint32(40, n * 4, true);
  const dr = mulberry32(5);
  for (let i = 0; i < n; i++) for (let c = 0; c < 2; c++) {
    const x = (c ? R[i] : L[i]) * gain * 32767 + (dr() - dr());
    out.setInt16(44 + (i * 2 + c) * 2, Math.max(-32768, Math.min(32767, Math.round(x))), true);
  }
  window.__audioStats = { peakRaw: peak, gain };
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};

/* ---- main.js ---- */
/* =====================================================================
   BOOT + PUBLIC API
   window.seek(t)            render the frame at absolute time t (s). Deterministic, stateless.
   window.captureFrame(t, offsets, weights) -> base64 RGB24 of a temporally supersampled frame
   window.renderSoundtrack() -> base64 WAV (48 kHz stereo 16-bit)
   ===================================================================== */
async function init() {
  await Text.init();
  FIELDS.terr = buildTerrain();
  TEX.terr = fieldTexture(FIELDS.terr, GX, GY);
  const sig = await buildWordField('SIGNAL', 'IDB', 900, 2.86, 0.0);
  FIELDS.sig = sig; TEX.sig = fieldTexture(sig.G, GX, GY);
  const tit = await buildWordField('ISOLINE', 'IDB', 900, 2.62, 0.0);
  FIELDS.tit = tit; TEX.tit = fieldTexture(tit.G, GX, GY);
  FieldPlane.init(); Terraces.init(); Lines.init(); Fills.init();
  if (typeof sceneInit === 'function') sceneInit();
}

// wrap only outside [0, 15] so that seek(15) is genuinely evaluated by the closing motion
const wrapT = (t) => (t < 0 || t > DUR ? ((t % DUR) + DUR) % DUR : t);
window.seek = (t) => { renderFrame(wrapT(t)); gl.finish(); return true; };

let _acc = null, _px = null;
window.captureFrame = (t, offsets = [0], weights = [1]) => {
  const N = W * H;
  if (!_acc) { _acc = new Float32Array(N * 3); _px = new Uint8Array(N * 4); }
  _acc.fill(0);
  let wsum = 0;
  for (let k = 0; k < offsets.length; k++) {
    renderFrame(wrapT(t + offsets[k]));
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, _px);
    const w = weights[k]; wsum += w;
    for (let y = 0; y < H; y++) {           // flip: GL rows are bottom-up
      const src = (H - 1 - y) * W * 4, dst = y * W * 3;
      for (let x = 0; x < W; x++) {
        const s = src + x * 4, d = dst + x * 3;
        _acc[d] += _px[s] * w; _acc[d + 1] += _px[s + 1] * w; _acc[d + 2] += _px[s + 2] * w;
      }
    }
  }
  const out = new Uint8Array(N * 3), inv = 1 / wsum;
  for (let i = 0; i < N * 3; i++) out[i] = Math.min(255, Math.round(_acc[i] * inv));
  let s = '';
  for (let i = 0; i < out.length; i += 0x8000) s += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
  return btoa(s);
};

window.ready = init().then(() => { window.seek(0); window.__ready = true; return true; })
  .catch((e) => { window.__error = String(e && e.stack || e); console.error(e); throw e; });

// optional live preview: click to play with sound (the render path never uses this)
document.addEventListener('click', async () => {
  if (window.__playing || !window.renderSoundtrack) return;
  window.__playing = true;
  const ac = new AudioContext({ sampleRate: 48000 });
  const b64 = await window.renderSoundtrack();
  const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const buf = await ac.decodeAudioData(bin.buffer);
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
  const t0 = ac.currentTime + 0.1; src.start(t0);
  const loop = () => { const t = (ac.currentTime - t0); if (t >= 0) window.seek(t % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
