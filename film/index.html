  cx.font = `${weight} ${size}px "${family}"`;

  const asc = m2.actualBoundingBoxAscent, desc = m2.actualBoundingBoxDescent;
  const vis = m2.actualBoundingBoxLeft + m2.actualBoundingBoxRight;
  const x = cw / 2 - vis / 2 + m2.actualBoundingBoxLeft;
  // canvas y grows downward; q.y = centerY maps to row (1 - centerY)/2 * ch
  const yc = (1 - centerY) / 2 * ch;
  const y = yc + (asc - desc) / 2;
  cx.fillStyle = '#fff';
  cx.fillText(word, x, y);
  const img = cx.getImageData(0, 0, cw, ch).data;
  const alpha = new Uint8Array(cw * ch);
  for (let i = 0; i < cw * ch; i++) alpha[i] = img[i * 4];
  const sd = sdfFromAlpha(alpha, cw, ch);
  // to grid (flip vertical: grid row 0 = q.y = -1 = bottom)
  const G = new Float32Array(GX * GY), uPerPx = (2 * MW) / cw;
  for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) {
    let acc = 0;
    for (let b = 0; b < res; b++) for (let a = 0; a < res; a++) {
      const px = i * res + a, py = (GY - 1 - j) * res + b;
      acc += sd[py * cw + px];
    }
    G[j * GX + i] = (acc / (res * res)) * uPerPx;
  }
  return { G, capU: (asc) * uPerPx, size, widthU: vis * uPerPx, ascU: asc * uPerPx, descU: desc * uPerPx };
}

/* ---- isobands: terraces from a scalar field (level units) ----
   caps : x z lv lv 0 0 0 g       (8 floats / vertex, triangles; g = field value, for analytic contour lines)
   walls: x z lvLo lvHi t nx nz g (8 floats / vertex, triangles)
   segs : x0 z0 x1 z1 lv          (5 floats / instance)                       */
function Isobands() {
  const verts = new FBuf(1 << 20), segs = new FBuf(1 << 18), runs = new FBuf(1 << 16);
  const P = new Float64Array(48), Q2 = new Float64Array(48);   // scratch polygons (x,y,g)*n
  function emitTri(ax, ay, bx, by, cx, cy, lv, ga, gb, gc) {
    if (SKIP0 && lv === 0) return;
    verts.need(24); const a = verts.a; let n = verts.n;
    a[n++] = ax; a[n++] = -ay; a[n++] = lv; a[n++] = lv; a[n++] = 0; a[n++] = 0; a[n++] = 0; a[n++] = ga;
    a[n++] = bx; a[n++] = -by; a[n++] = lv; a[n++] = lv; a[n++] = 0; a[n++] = 0; a[n++] = 0; a[n++] = gb;
    a[n++] = cx; a[n++] = -cy; a[n++] = lv; a[n++] = lv; a[n++] = 0; a[n++] = 0; a[n++] = 0; a[n++] = gc;
    verts.n = n;
  }
  function emitWall(ax, ay, bx, by, lo, hi, nx, ny) {
    // world normal (q.y -> -z)
    const wx = nx, wz = -ny;
    verts.need(48); const a = verts.a; let n = verts.n;
    const V = (x, y, t) => { a[n++] = x; a[n++] = -y; a[n++] = lo; a[n++] = hi; a[n++] = t; a[n++] = wx; a[n++] = wz; a[n++] = hi; };
    V(ax, ay, 0); V(bx, by, 0); V(bx, by, 1);
    V(ax, ay, 0); V(bx, by, 1); V(ax, ay, 1);
    verts.n = n;
  }
  // canonical edge crossing: identical result whichever triangle (and direction) asks -> watertight mesh
  let CX = 0, CY = 0;
  function cross(ax, ay, ag, bx, by, bg, lv) {
    if (ax > bx || (ax === bx && ay > by)) { let s = ax; ax = bx; bx = s; s = ay; ay = by; by = s; s = ag; ag = bg; bg = s; }
    const t = (lv - ag) / (bg - ag);
    CX = ax + (bx - ax) * t; CY = ay + (by - ay) * t;
  }
  // clip polygon src (len m) keeping g >= lv (sign=+1) or g <= lv (sign=-1); returns new length in dst
  function clip(src, m, dst, lv, sign) {
    let k = 0;
    for (let i = 0; i < m; i++) {
      const j = (i + 1) % m;
      const ax = src[i * 3], ay = src[i * 3 + 1], ag = src[i * 3 + 2];
      const bx = src[j * 3], by = src[j * 3 + 1], bg = src[j * 3 + 2];
      const ain = sign > 0 ? ag >= lv : ag <= lv, bin = sign > 0 ? bg >= lv : bg <= lv;
      if (ain) { dst[k * 3] = ax; dst[k * 3 + 1] = ay; dst[k * 3 + 2] = ag; k++; }
      if (ain !== bin) { cross(ax, ay, ag, bx, by, bg, lv); dst[k * 3] = CX; dst[k * 3 + 1] = CY; dst[k * 3 + 2] = lv; k++; }
    }
    return k;
  }
  function tri(x0, y0, g0, x1, y1, g1, x2, y2, g2, L) {
    const gmin = Math.min(g0, g1, g2), gmax = Math.max(g0, g1, g2);
    const lo = clamp(Math.floor(gmin), 0, L), hi = clamp(Math.floor(gmax), 0, L);
    if (lo === hi) { emitTri(x0, y0, x1, y1, x2, y2, lo, g0, g1, g2); return; }
    for (let lv = lo; lv <= hi; lv++) {
      P[0] = x0; P[1] = y0; P[2] = g0; P[3] = x1; P[4] = y1; P[5] = g1; P[6] = x2; P[7] = y2; P[8] = g2;
      let m = 3, src = P, dst = Q2;
      if (lv > lo) { m = clip(src, m, dst, lv, +1); const t = src; src = dst; dst = t; }
      if (lv < hi) { m = clip(src, m, dst, lv + 1, -1); const t = src; src = dst; dst = t; }
      for (let k = 1; k + 1 < m; k++) emitTri(src[0], src[1], src[k * 3], src[k * 3 + 1], src[(k + 1) * 3], src[(k + 1) * 3 + 1], lv, src[2], src[k * 3 + 2], src[(k + 1) * 3 + 2]);
    }
    // gradient of the linear interpolant -> outward (downhill) wall normal
    const ex1 = x1 - x0, ey1 = y1 - y0, ex2 = x2 - x0, ey2 = y2 - y0, dg1 = g1 - g0, dg2 = g2 - g0;
    const det = ex1 * ey2 - ex2 * ey1;
    let gx = (dg1 * ey2 - dg2 * ey1) / det, gy = (ex1 * dg2 - ex2 * dg1) / det;
    const gl_ = Math.hypot(gx, gy) || 1; gx /= gl_; gy /= gl_;
    for (let lv = lo + 1; lv <= hi; lv++) {
      // two crossing points of g = lv on the triangle edges
      let c = 0, ax = 0, ay = 0, bx = 0, by = 0;
      const E3 = [[x0, y0, g0, x1, y1, g1], [x1, y1, g1, x2, y2, g2], [x2, y2, g2, x0, y0, g0]];
      for (const e of E3) {
        if ((e[2] < lv) !== (e[5] < lv)) {
          cross(e[0], e[1], e[2], e[3], e[4], e[5], lv);
          const px = CX, py = CY;
          if (c === 0) { ax = px; ay = py; } else { bx = px; by = py; }
          c++;
        }
      }
      if (c < 2) continue;
      emitWall(ax, ay, bx, by, lv - 1, lv, -gx, -gy);
      segs.need(5); const s = segs.a; let n = segs.n;
      s[n++] = ax; s[n++] = -ay; s[n++] = bx; s[n++] = -by; s[n++] = lv; segs.n = n;
    }
  }
  // average wall normals across segments that share an endpoint (removes faceting on curved walls)
  const acc = new Map();
  function smoothWallNormals() {
    acc.clear();
    const a = verts.a, n = verts.n;
    const key = (i) => Math.round(a[i] * 2e5) + ',' + Math.round(a[i + 1] * 2e5) + ',' + a[i + 3];
    for (let i = 0; i < n; i += 8) {
      if (a[i + 5] === 0 && a[i + 6] === 0) continue;
      const k = key(i); let v = acc.get(k); if (!v) { v = [0, 0]; acc.set(k, v); }
      v[0] += a[i + 5]; v[1] += a[i + 6];
    }
    for (let i = 0; i < n; i += 8) {
      if (a[i + 5] === 0 && a[i + 6] === 0) continue;
      const v = acc.get(key(i)), l = Math.hypot(v[0], v[1]) || 1;
      a[i + 5] = v[0] / l; a[i + 6] = v[1] / l;
    }
  }
  /* G: field in level units. sub: grid stride (1 = full res).
     grid (optional): {w, h, x0, y0, dx, dy} for fields other than the map grid; skip0: omit band 0 (glyph solids) */
  let SKIP0 = false;
  function build(G, L, sub = 1, grid = null, skip0 = false) {
    verts.reset(); segs.reset(); runs.reset(); SKIP0 = skip0;
    const gw = grid ? grid.w : GX, gh = grid ? grid.h : GY;
    const gx0 = grid ? grid.x0 : -MW + 0.5 * DX, gy0 = grid ? grid.y0 : -1 + 0.5 * DY;
    const gdx = grid ? grid.dx : DX, gdy = grid ? grid.dy : DY;
    const nx = Math.floor((gw - 1) / sub) + 1, ny = Math.floor((gh - 1) / sub) + 1;
    const X = (i) => gx0 + i * sub * gdx, Y = (j) => gy0 + j * sub * gdy;
    const val = (i, j) => G[(j * sub) * gw + i * sub] + 1e-4;
    const DXr = gdx;
    for (let j = 0; j < ny - 1; j++) {
      let runStart = -1, runLv = -1;
      const y0 = Y(j), y1 = Y(j + 1);
      const flush = (iEnd) => {
        if (runStart >= 0) {
          if (SKIP0 && runLv === 0) { runStart = -1; runLv = -1; return; }
          const e = 0.35 * DXr, xa = X(runStart) - e, xb = X(iEnd) + e, ya = y0 - e, yb = y1 + e, gm = runLv + 0.5, lv = runLv;
          runs.need(48); const a = runs.a; let n = runs.n;
          for (const [x, y] of [[xa, ya], [xb, ya], [xb, yb], [xa, ya], [xb, yb], [xa, yb]]) { a[n++] = x; a[n++] = -y; a[n++] = lv; a[n++] = lv; a[n++] = 0; a[n++] = 0; a[n++] = 0; a[n++] = gm; }
          runs.n = n;
        }
        runStart = -1; runLv = -1;
      };
      for (let i = 0; i < nx - 1; i++) {
        const ga = val(i, j), gb = val(i + 1, j), gc = val(i + 1, j + 1), gd = val(i, j + 1);
        const mn = Math.min(ga, gb, gc, gd), mx = Math.max(ga, gb, gc, gd);
        const lo = clamp(Math.floor(mn), 0, L), hi = clamp(Math.floor(mx), 0, L);
        if (lo === hi && (lo === 0 || mn - lo > 0.12) && (lo === L || lo + 1 - mx > 0.12)) {
          if (runStart >= 0 && runLv === lo) continue;
          flush(i); runStart = i; runLv = lo; continue;
        }
        flush(i);
        const xa = X(i), xb = X(i + 1);
        tri(xa, y0, ga, xb, y0, gb, xb, y1, gc, L);
        tri(xa, y0, ga, xb, y1, gc, xa, y1, gd, L);
      }
      flush(nx - 1);
    }
    smoothWallNormals();
    const nTri = verts.n / 8;
    verts.need(runs.n); verts.a.set(runs.a.subarray(0, runs.n), verts.n); verts.n += runs.n;   // runs appended last
    return { verts: verts.view(), segs: segs.view(), nv: verts.n / 8, ns: segs.n / 5, nTri };
  }
  return { build };
}

/* contour polylines of one level along a horizontal section, used by the interface */
function sectionProfile(G, y, n = 600) {
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = -MW + (i / (n - 1)) * 2 * MW; out[i] = gridSample(G, x, y); }
  return out;
}

const FIELD_VS = `#version 300 es
in vec2 aPos;
uniform mat4 uVP;
uniform vec4 uWhipFrame;   // c.xy, dir.xy  (plan coords)
uniform vec4 uPulse[6];    // pos, ampV, ampY, sigma
uniform vec4 uSheet;       // amp, wavelength, phase, along-decay
uniform sampler2D uSigV; uniform vec4 uRelief; uniform vec4 uMapRectV;   // relief: height, front x, front width, 0
out vec3 vW;
void main(){
  vec2 q = vec2(aPos.x, -aPos.y);
  float s = dot(q - uWhipFrame.xy, uWhipFrame.zw);
  float n = dot(q - uWhipFrame.xy, vec2(-uWhipFrame.w, uWhipFrame.z));
  float y = 0.;
  for (int i = 0; i < 6; i++) { float x = (s - uPulse[i].x) / uPulse[i].w; y += uPulse[i].z * exp(-x * x) * exp(-n * n * 0.35); }
  y += uSheet.x * sin(6.2831853 * s / uSheet.y - uSheet.z) * exp(-abs(s) * uSheet.w);
  if (uRelief.x > 0.) {
    float sd = textureLod(uSigV, (q - uMapRectV.xy) / uMapRectV.zw, 0.).r;
    float rise = clamp((uRelief.y - q.x) / uRelief.z, 0., 1.);
    y += uRelief.x * smoothstep(.014, -.014, sd) * rise * rise * (3. - 2. * rise);
  }
  vW = vec3(aPos.x, y, aPos.y);
  gl_Position = uVP * vec4(vW, 1.);
}`;

const FIELD_FS = `#version 300 es
precision highp float;
in vec3 vW;
out vec4 oC;
uniform vec3 uBg;
uniform vec4 uA0, uA1, uA2, uA3, uA4, uB0, uB1, uB2, uB3, uB4;
// X0: c.xy dir.xy | X1: W m0 f mode | X2: sp invS v0 hwPx | X3: rgb alpha | X4: hwWorld gapPx idxBoost idxEvery
uniform vec4 uPulse[6]; uniform vec4 uSag; uniform vec4 uWhipFrame;
uniform vec4 uWeave;              // dir.xy, front, mode (0 A-top, 1 parity behind front, 2 B-top)
uniform sampler2D uTerr; uniform vec4 uMapRect; uniform float uK; uniform float uKoff;
uniform sampler2D uSig; uniform vec4 uSigP; uniform vec4 uSigQ;
// SigP: amount stretch split blur | SigQ: phase duty morph wipeY
uniform sampler2D uTit; uniform vec4 uTitP; uniform vec4 uTitQ; uniform vec4 uTitR;
// TitP: maskB stretch open fill | TitQ: ringAlpha ringSp ringDelta ringCount | TitR: ringW 0 0 0
uniform float uSweep; uniform float uInside;
uniform vec3 uRingCol;
uniform vec3 uEye; uniform vec2 uFog;

float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
float whipD(float s) {
  float d = 0.;
  for (int i = 0; i < 6; i++) { float x = (s - uPulse[i].x) / uPulse[i].w; d += uPulse[i].y * exp(-x * x); }
  float sl = s / uSag.y; d -= uSag.x * max(0., 1. - sl * sl);
  return d;
}
vec2 subdiv(float v, float Wd, float m0, float f) {
  float cells = exp2(m0), cw = Wd / cells;
  float u = (v + Wd * .5) / cw;
  float cell = floor(u), cu = fract(u) - .5, o = f * .25;
  float d1 = abs(cu - o), d2 = abs(cu + o);
  float side = d1 < d2 ? 1. : 0.;
  float inside = (u >= 0. && u < cells) ? 1. : 0.;
  return vec2(inside > .5 ? min(d1, d2) * cw : 1e3, cell * 2. + side);
}
void main() {
  vec2 q = vec2(vW.x, -vW.z);
  float pw = sqrt(abs(dFdx(q.x) * dFdy(q.y) - dFdx(q.y) * dFdy(q.x)));
  float sW = dot(q - uWhipFrame.xy, uWhipFrame.zw);
  vec2 nW = vec2(-uWhipFrame.w, uWhipFrame.z);
  float wd = whipD(sW);
  vec2 nA = vec2(-uA0.w, uA0.z), nB = vec2(-uB0.w, uB0.z);
  float vA = dot(q - uA0.xy, nA) - wd * dot(nW, nA);
  float vB = dot(q - uB0.xy, nB) - wd * dot(nW, nB);
  vec2 tuv = (q - uMapRect.xy) / uMapRect.zw;
  float hT = texture(uTerr, tuv).r;

  float FB0 = (vB - uB2.z) * uB2.y / uB2.x;
  float strip = floor(FB0 + .5);
  float par = mod(strip, 2.) * 2. - 1.;
  vec2 lq = vec2(q.x / uSigP.y + par * uSigP.z, q.y);
  float sdS = texture(uSig, (lq - uMapRect.xy) / uMapRect.zw).r;
  float aaS = pw * .8 / uSigP.y + uSigP.w;
  float LS = (1. - smoothstep(-aaS, aaS, sdS)) * uSigP.x * step(uSigQ.w, q.y);
  float phiB = LS * uSigQ.x * (1. - uSigQ.z) + uK * hT + uKoff;
  float FB = FB0 + phiB;
  float FA = (vA - uA2.z) * uA2.y / uA2.x;

  float sdT0 = texture(uTit, tuv).r;
  float aaT = pw * .8;
  float LT = 1. - smoothstep(-aaT, aaT, sdT0 - uTitP.w);
  if (uTitP.y > 1e-4) {            // directional smear: horizontal running max of the letter mask
    for (int k = -8; k <= 8; k++) {
      vec2 sq = q + vec2(float(k) / 8. * uTitP.y, 0.);
      float s = textureLod(uTit, (sq - uMapRect.xy) / uMapRect.zw, 0.).r - uTitP.w;
      LT = max(LT, 1. - smoothstep(-aaT, aaT, s));
    }
  }
  float ringF = (sdT0 - uTitQ.z) / uTitQ.y;

  float gvA = length(vec2(dFdx(vA), dFdy(vA))), gvB = length(vec2(dFdx(vB), dFdy(vB)));
  float gFA = length(vec2(dFdx(FA), dFdy(FA))), gFB = length(vec2(dFdx(FB), dFdy(FB)));
  float gR = length(vec2(dFdx(ringF), dFdy(ringF)));

  // family A
  float dA, iA, spA;
  if (uA1.w < .5) { vec2 s = subdiv(vA, uA1.x, uA1.y, uA1.z); dA = s.x / max(gvA, 1e-7); iA = s.y; spA = 1e3; }
  else { dA = abs(fract(FA + .5) - .5) / max(gFA, 1e-7); iA = floor(FA + .5); spA = 1. / max(gFA, 1e-7); }
  float wA = max(2. * uA2.w, 2. * uA4.x / max(gvA, 1e-7));
  float mA = (uA1.w > .5 && uA1.x > 0.) ? step(abs(vA), uA1.x * .5) : 1.;
  float cA = cover(dA, wA) * mA;
  cA = mix(cA, min(wA / spA, 1.), smoothstep(3., 1.4, spA));

  // family B
  float dB, iB, spB;
  if (uB1.w < .5) { vec2 s = subdiv(vB, uB1.x, uB1.y, uB1.z); dB = s.x / max(gvB, 1e-7); iB = s.y; spB = 1e3; }
  else { dB = abs(fract(FB + .5) - .5) / max(gFB, 1e-7); iB = floor(FB + .5); spB = 1. / max(gFB, 1e-7); }
  float wB = max(2. * uB2.w, 2. * uB4.x / max(gvB, 1e-7));
  float isIdx = abs(mod(iB, uB4.w)) < .5 ? 1. : 0.;
  float sweepM = 1. - smoothstep(uSweep - .03, uSweep + .03, q.x);
  wB *= mix(1., uB4.z, isIdx * sweepM);
  wB += LS * uSigQ.y * min(spB, 60.) * (1. - uSigQ.z);
  wB = mix(wB, mix(spB + 1.5, wB, uTitP.z), uTitP.x);
  float mB = ((uB1.w > .5 && uB1.x > 0.) ? step(abs(vB), uB1.x * .5) : 1.) * mix(1., LT, uTitP.x);
  if (uInside > .5 && uK > 0.) dB = abs(fract(FB) / max(gFB, 1e-7) - wB * .5);
  float cB = cover(dB, wB) * mB;
  cB = mix(cB, min(wB / spB, 1.), smoothstep(3., 1.4, spB));

  // rings around the title letters (level sets of the title distance field)
  float iR = floor(ringF + .5);
  float dR = abs(ringF - iR) / max(gR, 1e-7);
  if (uInside > .5) { iR = ceil(ringF); dR = abs((iR - ringF) / max(gR, 1e-7) - uTitR.x * .5); }
  float cR = cover(dR, uTitR.x) * step(.5, iR) * step(iR, uTitQ.w + .5) * uTitQ.x;
  cR *= smoothstep(0., pw * 1.5, sdT0);

  bool aTop;
  if (uWeave.w < .5) aTop = true;
  else if (uWeave.w < 1.5) { float behind = step(dot(q, uWeave.xy), uWeave.z); aTop = behind * mod(iA + iB, 2.) < .5; }
  else aTop = false;
  float gA = cover(dA, wA + 2. * uA4.y) * mA, gB = cover(dB, wB + 2. * uB4.y) * mB;

  float fog = 1. - smoothstep(uFog.x, uFog.y, length(vW - uEye));
  cA *= fog; cB *= fog; cR *= fog;
  vec3 col = uBg;
  col = mix(col, uRingCol, cR);
  if (aTop) { col = mix(col, uB3.rgb, cB * uB3.a * (1. - gA * uA3.a)); col = mix(col, uA3.rgb, cA * uA3.a); }
  else { col = mix(col, uA3.rgb, cA * uA3.a * (1. - gB * uB3.a)); col = mix(col, uB3.rgb, cB * uB3.a); }
  oC = vec4(col, 1.);
}`;

const FieldPlane = (() => {
  let prog, vao, count, vaoD, countD;
  // grid mesh over [x0,x1]x[z0,z1] with N x M cells; hole: skip cells fully inside [hx0,hx1]x[hz0,hz1]
  function gridMesh(x0, x1, z0, z1, N, M, hole) {
    const v = new Float32Array((N + 1) * (M + 1) * 2); let k = 0;
    for (let j = 0; j <= M; j++) for (let i = 0; i <= N; i++) { v[k++] = x0 + ((x1 - x0) * i) / N; v[k++] = z0 + ((z1 - z0) * j) / M; }
    const idx = []; 
    for (let j = 0; j < M; j++) for (let i = 0; i < N; i++) {
      if (hole) { const cx0 = x0 + ((x1 - x0) * i) / N, cx1 = x0 + ((x1 - x0) * (i + 1)) / N, cz0 = z0 + ((z1 - z0) * j) / M, cz1 = z0 + ((z1 - z0) * (j + 1)) / M;

/* ---------------- 2. TERRACES: isoband mesh, extruded per level ---------------- */
const TERR_VS = `#version 300 es
in vec2 aPos; in vec3 aLv; in vec2 aN; in float aG;
uniform mat4 uVP; uniform float uLift[64]; uniform vec4 uXf; // map transform: offset.xz, scale, yOffset
out vec3 vW; out vec2 vN; out float vT; out float vG; flat out float vLv; flat out float vKind;
void main(){
  vG = aG;
  float y = mix(uLift[int(aLv.x)], uLift[int(aLv.y)], aLv.z);
  vec2 p = aPos * uXf.z + uXf.xy;
  vW = vec3(p.x, y * uXf.z + uXf.w, p.y);
  vN = aN; vT = aLv.z; vLv = aLv.y;

}`;
const TERR_FS = `#version 300 es
precision highp float;
in vec3 vW; in vec2 vN; in float vT; in float vG; flat in float vLv; flat in float vKind;
out vec4 oC;
uniform vec3 uCapLo, uCapHi; uniform vec4 uTint;   // amount, gamma, topLevel, topBoost
uniform float uLmax;
uniform vec4 uLine;     // width px, index width px, index every, alpha
uniform vec3 uLineCol, uInk; uniform float uSkipLevel, uSkipAmt;
uniform vec2 uLight;
uniform vec3 uWallLit, uWallDark;
uniform vec4 uStrata;   // spacing(world), width px, alpha, 0
uniform vec4 uXf;
float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
void main(){
  vec3 col;

    float h = vLv / uLmax;
    col = mix(uCapLo, uCapHi, pow(h, uTint.y) * uTint.x);
    if (vLv >= uTint.z - .5) col = mix(col, uCapHi, uTint.w);
    // contour line: the level set g = level, drawn just inside this cap's outer edge
    float la = uLine.w * (abs(vLv - uSkipLevel) < .5 ? 1. - uSkipAmt : 1.);
    if (vLv > .5 && la > 0.) {
      float w = abs(mod(vLv, uLine.z)) < .5 ? uLine.y : uLine.x;
      float d = (vG - vLv) / max(gg, 1e-6);
      float lum = dot(col, vec3(.299, .587, .114));
      vec3 lc = mix(uLineCol, uInk, smoothstep(.42, .62, lum));
      col = mix(col, lc, cover(abs(d - w * .5), w) * la);
    }
  } else {
    float lam = dot(normalize(vN), uLight);
    col = mix(uWallDark, uWallLit, smoothstep(-.4, 1., lam));
    col *= mix(.62, 1., vT);
    float f = (vW.y - uXf.w) / uXf.z / uStrata.x;
    float g = length(vec2(dFdx(f), dFdy(f)));
    float d = abs(fract(f + .5) - .5) / max(g, 1e-6);
    col = mix(col, col * .45, cover(d, uStrata.y) * uStrata.z * smoothstep(.6, 2., 1. / max(g, 1e-6)));

}`;
const TERRL_VS = `#version 300 es
in vec2 aC;                // corner: along (0|1), side (-1|1)
in vec4 aSeg; in float aLvl;
uniform mat4 uVP; uniform vec2 uRes; uniform float uLift[64]; uniform vec4 uXf;
uniform float uW, uWIdx, uEvery, uBias;
out float vD; flat out float vWd; flat out float vLv;
void main(){
  float y = uLift[int(aLvl)] * uXf.z + uXf.w;

  vec2 d = s1 - s0; float L = length(d); d = L > 1e-5 ? d / L : vec2(1., 0.);

  float hw = wd * .5 + 1.;

  vec2 off = n * aC.y * hw + d * (aC.x * 2. - 1.) * hw * .5;

const TERRL_FS = `#version 300 es
precision highp float;
in float vD; flat in float vWd; flat in float vLv;
out vec4 oC;
uniform vec4 uCol; uniform vec4 uColIdx; uniform float uEvery;
uniform vec3 uCapLo, uCapHi; uniform vec4 uTint; uniform float uLmax; uniform vec3 uInk;
float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }

  vec4 c = abs(mod(vLv, uEvery)) < .5 ? uColIdx : uCol;

  float tnt = pow(vLv / uLmax, uTint.y) * uTint.x;

const Terraces = (() => {
  let prog, lprog, vao, vbo, lvao, lbo, cornerBuf, nv = 0, ns = 0, nTri = 0;
  function init() {
    prog = Program(TERR_VS, TERR_FS);

    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    const st = 32;
    let l;
    l = prog.a('aPos'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, st, 0);
    l = prog.a('aLv'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, st, 8);
    l = prog.a('aN'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, st, 20);
    l = prog.a('aG'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 1, gl.FLOAT, false, st, 28);
    gl.bindVertexArray(null);
    lvao = gl.createVertexArray(); gl.bindVertexArray(lvao);
    cornerBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cornerBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 1, -1, 0, 1, 1, 1]), gl.STATIC_DRAW);
    l = lprog.a('aC'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
    lbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, lbo);
    l = lprog.a('aSeg'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 4, gl.FLOAT, false, 20, 0); gl.vertexAttribDivisor(l, 1);
    l = lprog.a('aLvl'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 1, gl.FLOAT, false, 20, 16); gl.vertexAttribDivisor(l, 1);
    gl.bindVertexArray(null);
  }

    if (key !== undefined && key === lastKey) return;

    gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, mesh.verts, gl.DYNAMIC_DRAW); nv = mesh.nv; nTri = mesh.nTri ?? mesh.nv;
    gl.bindBuffer(gl.ARRAY_BUFFER, lbo); gl.bufferData(gl.ARRAY_BUFFER, mesh.segs, gl.DYNAMIC_DRAW); ns = mesh.ns;
  }
  function liftArray(T) { const a = new Float32Array(64); for (let i = 0; i < 64; i++) a[i] = T.lift(i); return a; }

    const lift = liftArray(T);
    const xf = T.xf || [0, 0, 1, 0];
    prog.use(); let u = prog.u;
    gl.uniformMatrix4fv(u('uVP'), false, cam.vp);
    gl.uniform1fv(u('uLift'), lift);
    gl.uniform4fv(u('uXf'), xf);
    gl.uniform3fv(u('uCapLo'), T.capLo); gl.uniform3fv(u('uCapHi'), T.capHi);
    gl.uniform4fv(u('uTint'), T.tint);
    gl.uniform1f(u('uLmax'), T.L);
    gl.uniform2fv(u('uLight'), T.light);
    gl.uniform3fv(u('uWallLit'), T.wallLit); gl.uniform3fv(u('uWallDark'), T.wallDark);
    gl.uniform4fv(u('uStrata'), [T.strata[0], T.strata[1] * PX, T.strata[2], 0]);
    gl.uniform4f(u('uLine'), T.lineW * PX, T.lineWIdx * PX, T.every, T.lineAlpha);
    gl.uniform3fv(u('uLineCol'), T.lineCol); gl.uniform3fv(u('uInk'), T.lineInk || INK); gl.uniform1f(u('uSkipLevel'), T.skipLevel ?? -9); gl.uniform1f(u('uSkipAmt'), T.skipAmt ?? 1);

    gl.bindVertexArray(null);

      gl.uniformMatrix4fv(u('uVP'), false, cam.vp);
      gl.uniform2f(u('uRes'), W, H);
      gl.uniform1fv(u('uLift'), lift);
      gl.uniform4fv(u('uXf'), xf);
      gl.uniform1f(u('uW'), T.lineW * PX); gl.uniform1f(u('uWIdx'), T.lineWIdx * PX); gl.uniform1f(u('uEvery'), T.every);

/* ---------------- 3. LINES: instanced world-space segments, AA in screen space ---------------- */
const LINE_VS = `#version 300 es
in vec2 aC;
in vec3 aP0; in vec3 aP1; in vec4 aCol; in vec2 aWD;   // width px, dash-phase(unused<0)
uniform mat4 uVP; uniform vec2 uRes; uniform float uBias;
out vec2 vDW; out vec4 vCol; flat out float vWd;   // vDW = (screen distance * w, w): divided per fragment -> screen-linear
void main(){
  vec4 c0 = uVP * vec4(aP0, 1.), c1 = uVP * vec4(aP1, 1.);
  // clip exactly against the near plane (z + w >= 0 in clip space). Clipping at a tiny w instead leaves vertices with
  // screen coordinates ~1e6 px, and the rasterizer then drops segments that pass behind the camera.
  float e = 1e-6, P0 = c0.z + c0.w, P1 = c1.z + c1.w;
  if (P0 < e && P1 < e) { gl_Position = vec4(2., 2., 2., 1.); vDW = vec2(0., 1.); vCol = vec4(0.); vWd = 0.; return; }
  if (P0 < e) c0 = mix(c0, c1, (e - P0) / (P1 - P0));
  if (P1 < e) c1 = mix(c1, c0, (e - P1) / (P0 - P1));
  vec2 s0 = c0.xy / c0.w * .5 * uRes, s1 = c1.xy / c1.w * .5 * uRes;
  vec2 d = s1 - s0; float L = length(d); d = L > 1e-5 ? d / L : vec2(1., 0.);
  vec2 n = vec2(-d.y, d.x);
  float hw = aWD.x * .5 + 1.;
  vec4 c = mix(c0, c1, aC.x);
  vec2 off = n * aC.y * hw + d * (aC.x * 2. - 1.) * min(hw, aWD.x * .5 + .5);
  c.xy += off / (.5 * uRes) * c.w;
  c.z -= uBias * c.w;
  gl_Position = c; vDW = vec2(aC.y * hw * c.w, c.w); vCol = aCol; vWd = aWD.x;
}`;
const LINE_FS = `#version 300 es
precision highp float;
in vec2 vDW; in vec4 vCol; flat in float vWd;
out vec4 oC;
float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
void main(){ float a = cover(abs(vDW.x / vDW.y), vWd) * vCol.a; if (a < .003) discard; oC = vec4(vCol.rgb, a); }`;

const Lines = (() => {
  let prog, vao, buf, cbuf;
  const B = new FBuf(1 << 16);
  function init() {
    prog = Program(LINE_VS, LINE_FS);
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    cbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cbuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 1, -1, 0, 1, 1, 1]), gl.STATIC_DRAW);
    let l = prog.a('aC'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
    buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    const st = 48;
    const at = (n, sz, off) => { const l2 = prog.a(n); gl.enableVertexAttribArray(l2); gl.vertexAttribPointer(l2, sz, gl.FLOAT, false, st, off); gl.vertexAttribDivisor(l2, 1); };
    at('aP0', 3, 0); at('aP1', 3, 12); at('aCol', 4, 24); at('aWD', 2, 40);
    gl.bindVertexArray(null);

  function seg(p0, p1, col, w) { B.push(p0[0], p0[1], p0[2], p1[0], p1[1], p1[2], col[0], col[1], col[2], col[3], w * PX, 0); }

    gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, B.view(), gl.DYNAMIC_DRAW);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);

/* ---------------- 4. FILLS: world-space or screen-space triangles ---------------- */
const FILL_VS = `#version 300 es
in vec3 aP; in vec4 aCol;
uniform mat4 uVP; uniform vec2 uRes; uniform float uScreen;
out vec4 vCol;
void main(){
  vCol = aCol;
  if (uScreen > .5) gl_Position = vec4(aP.x / uRes.x * 2. - 1., 1. - aP.y / uRes.y * 2., 0., 1.);
  else gl_Position = uVP * vec4(aP, 1.);
}`;
const FILL_FS = `#version 300 es
precision highp float; in vec4 vCol; out vec4 oC; void main(){ oC = vCol; }`;
const Fills = (() => {
  let prog, vao, buf;
  const B = new FBuf(1 << 14), BS = new FBuf(1 << 12);

    let l = prog.a('aP'); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, 3, gl.FLOAT, false, 28, 0);

  function flush(cam, screenOnly = false) {

/* =====================================================================

   ===================================================================== */
const TEXT_VS = `#version 300 es
in vec3 aP; in vec2 aUV; in vec4 aCol; in vec2 aL; in vec4 aClip;
uniform mat4 uVP; uniform vec2 uRes; uniform float uScreen;
out vec2 vUV; out vec4 vCol; out vec2 vL; flat out vec4 vClip;

const TEXT_FS = `#version 300 es
precision highp float;
in vec2 vUV; in vec4 vCol; in vec2 vL; flat in vec4 vClip;
uniform sampler2D uAtlas;
out vec4 oC;
void main(){
  if (vL.x < vClip.x || vL.y < vClip.y || vL.x > vClip.z || vL.y > vClip.w) discard;
  float d = texture(uAtlas, vUV).r;

const Text = (() => {
  const AW = 2048, AH = 2048;

  async function loadFonts() {

  function buildAtlas() {
    const atlas = new Uint8Array(AW * AH);
    const cv = document.createElement('canvas'); const cx = cv.getContext('2d', { willReadFrequently: true });

      { key: 'display', css: '900 {s}px "IDB"', em: 150, spread: 14, chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:/-—′+−×°%' },
      { key: 'text', css: '600 {s}px "IST"', em: 64, spread: 7, chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;/-–—′\'·×+−=()%°→' },

        const a = Math.ceil(m.actualBoundingBoxAscent) + 1, d = Math.ceil(m.actualBoundingBoxDescent) + 1;

        cx.fillStyle = '#fff'; cx.textBaseline = 'alphabetic';

        const al = new Uint8Array(gw * gh); for (let i = 0; i < gw * gh; i++) al[i] = img[i * 4];

        for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
          const v = clamp(0.5 - sd[y * gw + x] / (2 * sp.spread));

      cx.font = css;
      const cs = [...sp.chars];
      for (const a of cs) for (const b of cs) {
        const k = cx.measureText(a + b).width - F.g[a].adv - F.g[b].adv;
        if (Math.abs(k) > 0.01) F.kern[a + b] = k;

  async function init() {
    await loadFonts();
    buildAtlas();
    prog = Program(TEXT_VS, TEXT_FS);
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    const st = 15 * 4;
    const at = (n, sz, off) => { const l = prog.a(n); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, sz, gl.FLOAT, false, st, off); };

  // layout in em-relative units (1 = font size)
  function layout(fk, str, track = 0) {

      const ch = str[i];
      if (i > 0) x += (F.kern[str[i - 1] + ch] || 0) / F.em;
      if (ch === ' ') { out.push({ ch, x, i }); x += F.space / F.em + track; continue; }
      const g = F.g[ch]; if (!g) { x += F.space / F.em; continue; }
      out.push({ ch, x, i, g }); x += g.adv / F.em + track;

    return { glyphs: out, width: x - track, cap: F.cap / F.em };
  }
  /* emit a string.
     place(lx, ly) -> [x,y,z] maps text-local coords (em units * size, y down from baseline) to output space.
     opts.glyph(i, n, ch) -> {dx, dy, a, sx, sy} kinetic per-glyph offsets (in size units). */

    const clip = opts.clip || NOCLIP;

      if (!G.g) continue;
      const k = opts.glyph ? opts.glyph(G.i, n, G.ch) : null;
      const a = col[3] * (k && k.a !== undefined ? k.a : 1);
      if (a <= 0.002) continue;
      const g = G.g, s = size / F.em;
      const sx = k && k.sx !== undefined ? k.sx : 1, sy = k && k.sy !== undefined ? k.sy : 1;
      const ox = (G.x + ax + (k ? k.dx || 0 : 0)) * size, oy = (k ? k.dy || 0 : 0) * size;
      const x0 = ox - g.l * s * sx, x1 = ox + (g.w - g.l) * s * sx;
      const y0 = oy - g.a * s * sy, y1 = oy + (g.h - g.a) * s * sy;
      const u0 = g.x / AW, v0 = g.y / AH, u1 = (g.x + g.w) / AW, v1 = (g.y + g.h) / AH;
      const P = [[x0, y0, u0, v0], [x1, y0, u1, v0], [x1, y1, u1, v1], [x0, y1, u0, v1]];
      const V = P.map(([lx, ly, u, v]) => { const p = place(lx, ly); return [p[0], p[1], p[2] || 0, u, v, col[0], col[1], col[2], a, lx, ly, clip[0], clip[1], clip[2], clip[3]]; });
      for (const idx of [0, 1, 2, 0, 2, 3]) B.push(...V[idx]);

  }

  function screen(fk, str, x, y, size, col, opts = {}) {
    return emit(BS, fk, str, size, col, (lx, ly) => [(x + lx) * PX, (y + ly) * PX, 0], opts);
  }

  function world(fk, str, origin, right, down, size, col, opts = {}) {
    return emit(BW, fk, str, size, col, (lx, ly) => [origin[0] + right[0] * lx + down[0] * ly, origin[1] + right[1] * lx + down[1] * ly, origin[2] + right[2] * lx + down[2] * ly], opts);

  function width(fk, str, size, track = 0) { return layout(fk, str, track).width * size; }
  function capHeight(fk) { return fonts[fk].cap / fonts[fk].em; }
  function flush(cam, which = 'both') {
    prog.use(); const u = prog.u;
    gl.uniformMatrix4fv(u('uVP'), false, cam.vp); gl.uniform2f(u('uRes'), W, H);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(u('uAtlas'), 0);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    gl.bindVertexArray(vao);
    if (which !== 'screen' && BW.n) {
      gl.uniform1f(u('uScreen'), 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, BW.view(), gl.DYNAMIC_DRAW);
      gl.drawArrays(gl.TRIANGLES, 0, BW.n / 15); BW.reset();
    }
    if (which !== 'world' && BS.n) {
      gl.disable(gl.DEPTH_TEST); gl.uniform1f(u('uScreen'), 1);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, BS.view(), gl.DYNAMIC_DRAW);
      gl.drawArrays(gl.TRIANGLES, 0, BS.n / 15); BS.reset(); gl.enable(gl.DEPTH_TEST);
    }
    gl.bindVertexArray(null); gl.depthMask(true); gl.disable(gl.BLEND);
  }
  return { init, screen, world, width, capHeight, flush, layout, fonts };
})();

/* ---- solids.js ---- */
/* =====================================================================
   SOLIDS — the physical interface: lit slabs/boxes/cylinders, soft drop
   shadows, contour-map surfaces on arbitrary 3D quads, and extruded glyph
   solids (isobands of each glyph's own distance field) on drum odometers.
   ===================================================================== */

// light: horizontal direction toward the light (same as the terrace walls) + elevation for top faces
const L3 = (() => { const a = [-0.95, 0.3], l = Math.hypot(a[0], a[1]); return [a[0] / l, 0.62, a[1] / l]; })();

/* ---------------- 1. lit triangle meshes ----------------
   per vertex: p.xyz n.xyz c.rgba mode
   mode 0 = print surface (exact colour), 1 = sculpted wall (shadow -> lit ramp of c), 2 = diffuse */
const SOLID_VS = `#version 300 es
in vec3 aP; in vec3 aN; in vec4 aC; in float aM;
uniform mat4 uVP;
out vec3 vN; out vec4 vC; flat out float vM; out vec3 vW;
void main(){ vN = aN; vC = aC; vM = aM; vW = aP; gl_Position = uVP * vec4(aP, 1.); }`;
const SOLID_FS = `#version 300 es
precision highp float;
in vec3 vN; in vec4 vC; flat in float vM; in vec3 vW;
uniform vec3 uL, uDark; uniform vec4 uStrata;
out vec4 oC;
float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
void main(){
  vec3 n = normalize(vN), col = vC.rgb;

      float f = vW.y / uStrata.x, g = length(vec2(dFdx(f), dFdy(f)));

    }
  } else if (vM > 1.5) {
    col = vC.rgb * (.55 + .45 * max(dot(n, normalize(uL)), 0.));

const Solids = (() => {
  let prog, vao, buf;
  const B = new FBuf(1 << 16);

    prog = Program(SOLID_VS, SOLID_FS);
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    const st = 44, at = (n, s, o) => { const l = prog.a(n); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, s, gl.FLOAT, false, st, o); };

  function box(x0, y0, z0, x1, y1, z1, topCol, sideCol, f = null, botCol = null, sideMode = 1) {
    const P = (x, y, z) => (f ? f([x, y, z]) : [x, y, z]);
    const c = [P(x0, y0, z0), P(x1, y0, z0), P(x1, y0, z1), P(x0, y0, z1), P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)];

    F(0, 1, 2, 3, botCol || sideCol, sideMode);   // bottom
    F(3, 2, 6, 7, sideCol, sideMode);             // +z (south)
    F(1, 0, 4, 5, sideCol, sideMode);             // -z (north)
    F(0, 3, 7, 4, sideCol, sideMode);             // -x (west)

    const P = (x, y, z) => (f ? f([x, y, z]) : [x, y, z]);

      tri(P(x0, cy, cz), P(x0, y1, z1), P(x0, y0, z0), norm3(sub3(P(-1, 0, 0), P(0, 0, 0))), col, 1);
      tri(P(x1, cy, cz), P(x1, y0, z0), P(x1, y1, z1), norm3(sub3(P(1, 0, 0), P(0, 0, 0))), col, 1);

    const n = B.n / 11; if (!n) return;

    gl.uniform4f(u('uStrata'), strata[0], strata[1] * PX, strata[2], 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, B.view(), gl.DYNAMIC_DRAW);

})();
const WALL_DARK_S = [0.085, 0.105, 0.56];

/* soft drop shadow of a rectangle footprint (x0..x1, z0..z1) floating at height h, cast on the ground */
function dropShadow(x0, z0, x1, z1, h, strength = 0.22, groundY = 0.0008) {
  if (h <= 1e-4) return;
  const k = 0.55, dx = -L3[0] * h * k, dz = -L3[2] * h * k;

  for (let i = 0; i < layers; i++) {
    const g = (i / (layers - 1) - 0.5) * h * 0.22;
    const a = (strength / layers) * clamp(1.4 - h * 0.6, 0.35, 1);
    Fills.rectXZ(x0 + dx - g, z0 + dz - g, x1 + dx + g, z1 + dz + g, groundY + i * 1e-5, [INK[0], INK[1], INK[2], a]);
  }
}

/* ---------------- 2. contour-map surfaces on any 3D quad ----------------
   per vertex: p.xyz q.xy (map plan coordinates). Lines are the same analytic level sets as everywhere else. */
const MAPS_VS = `#version 300 es
in vec3 aP; in vec2 aQ; in vec2 aA;
uniform mat4 uVP;
out vec2 vQ; out vec2 vA;
void main(){ vQ = aQ; vA = aA; gl_Position = uVP * vec4(aP, 1.); }`;
const MAPS_FS = `#version 300 es
precision highp float;
in vec2 vQ; in vec2 vA;
uniform sampler2D uT1, uT2; uniform float uMix, uK, uOff;
uniform vec4 uMapRect; uniform vec3 uBg, uLine; uniform vec4 uW;   // w, wIdx, every, alpha
uniform vec4 uFlip;                                                   // global invert amount; vA.y = per-quad invert
out vec4 oC;
float cover(float d, float w) { return max(0., min(d + w * .5, .5) - max(d - w * .5, -.5)); }
void main(){
  vec2 uv = (vQ - uMapRect.xy) / uMapRect.zw;

  float F = uK * h + uOff;
  float g = length(vec2(dFdx(F), dFdy(F)));
  float n = floor(F);
  float w = abs(mod(n, uW.z)) < .5 ? uW.y : uW.x;
  float d = fract(F) / max(g, 1e-7);
  float c = cover(abs(d - w * .5), w) * step(.5, n);
  float sp = 1. / max(g, 1e-7);
  c = mix(c, min(w / sp, 1.) * step(.5, n), smoothstep(3., 1.4, sp));
  float fl = clamp(uFlip.x + vA.y, 0., 1.);
  vec3 bg = mix(uBg, uLine, fl), ln = mix(uLine, uBg, fl);
  oC = vec4(mix(bg, ln, c * uW.w), vA.x);
}`;

const MapSurf = (() => {
  let prog, vao, buf;
  const B = new FBuf(1 << 12);

    prog = Program(MAPS_VS, MAPS_FS);

    const st = 28, at = (n, s, o) => { const l = prog.a(n); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, s, gl.FLOAT, false, st, o); };

  function quad(p, q, a = 1, flip = 0) { for (const i of [0, 1, 2, 0, 2, 3]) B.push(p[i][0], p[i][1], p[i][2], q[i][0], q[i][1], a, flip); }

    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, TEX.terr2); gl.uniform1i(u('uT2'), 1);

/* ---------------- 3. extruded glyph solids + drum odometers ---------------- */
const GLYPH_VS = `#version 300 es
in vec2 aPos; in vec3 aLv; in vec2 aN; in float aG;
uniform mat4 uVP, uM; uniform float uDepth;

  vN = mat3(uM) * (wall ? vec3(aN.x, 0., aN.y) : vec3(0., 1., 0.));

uniform vec3 uCap, uLit, uDark, uL;

const M4 = {

/* drum odometer: glyphs on a cylinder around an axis parallel to world x.

function drum(fk, chars, value, o) {
  const n = chars.length, step = TAU / n * (o.spread ?? 1);
  const size = o.size, R = o.radius ?? size * 0.62, depth = o.depth ?? size * 0.12;
  const base = o.base;              // matrix: drum frame -> world (origin = drum axis at the cell's left edge)
  for (let i = 0; i < n; i++) {
    let k = i - (value % n); if (k > n / 2) k -= n; if (k < -n / 2) k += n;
    const th = k * step;
    if (Math.abs(th) > 1.9) continue;
    const g = Glyph3D.mesh(fk, chars[i]);
    const cx = (o.cell - (g.maxX + g.minX) * size) / 2;          // centre horizontally in the cell
    const M = M4.mul(base, M4.Rx(th), M4.T(cx, R, g.asc * size * 0.5), M4.S(size));
    Glyph3D.put(fk, chars[i], M, depth / size, o.cap, o.lit, o.dark);
  }
}

/* ---- scene_system.js ---- */
/* =====================================================================
   SCENE (75 s) — Movement III (the interface as physical slabs, exploded in 3D)
   and Movement IV (the map subdivides into a network of module towers).

const COLX = MW + UI_GUT;                                  // right column x

}

/* ----------------------------------------------------------------- slab state (III) */

  let xp = xl;
  if (t > 31.5) { const ph = (t - 31.5) / 0.5, k = Math.floor(ph), f = E.inOutCubic(ph - k); xp = mix(xl, xr2, k % 2 === 0 ? f : 1 - f); }
  const gp = fieldAt(xp, -zs, t), lvp = clamp(Math.floor(gp), 0, L), elev = Math.max(0, gp - 0.5) * M_PER_LEVEL;
  const pr = E.outCubic(unit(31.45, 31.75, t)) * (1 - unit(44.0, 44.3, t));
  if (pr > 0) {
    const s = 5 / UI_S * pr, a = MX([xp, Y, zs]), b = CX([xp, Y + S.fin, lz(Math.max(0, gp - 0.5))]);

    const val = mix(0, elev, E.outCubic(unit(31.2, 31.7, t)));
    const wheels = digitsRoll(val, 3), cell = Text.width('display', '0', size) * 1.02, base = top + 40 / UI_S + capU;
    if (S.rise <= 0) {       // flat: printed odometer

/* ----------------------------------------------------------------- tiles / towers (44.4–62 s) */
const TILES = [];
const TCOLS = 8, TROWS = 4, TW_ = (2 * MW) / TCOLS, TH_ = 2 / TROWS, STREET = 0.12, AVENUE = 0.6;
function systemInit() {
  let mx = 0;
  for (let r = 0; r < TROWS; r++) for (let c = 0; c < TCOLS; c++) {
    const x0 = -MW + c * TW_, z0 = -1 + r * TH_;
    let s = 0, n = 0;
    for (let j = 0; j < 12; j++) for (let i = 0; i < 12; i++) { s += gridSample(FIELDS.terr2, x0 + (i + 0.5) / 12 * TW_, -(z0 + (j + 0.5) / 12 * TH_)); n++; }
    const e = s / n; mx = Math.max(mx, e);
    TILES.push({ c, r, x0, z0, e, id: 'ABCDEFGH'[c] + (r + 1) });
  }
  for (const T of TILES) T.e /= mx;
}
// binary subdivision order: x, z, x, z, x  (1 -> 2 -> 4 -> 8 -> 16 -> 32)
const SPLIT_T = [45.0, 45.125, 45.25, 45.375, 45.5];
const MERGE_T = [59.3, 59.425, 59.55, 59.675, 59.8];
function tileOffset(T, t) {
  const bits = [[0, (T.c >> 2) & 1], [1, (T.r >> 1) & 1], [0, (T.c >> 1) & 1], [1, T.r & 1], [0, T.c & 1]];
  let ox = 0, oz = 0;
  bits.forEach(([axis, b], k) => {
    const open = snap(t - SPLIT_T[k], 0.1, 6) * (1 - snap(t - MERGE_T[4 - k], 0.1, 6));
    const d = (b ? 1 : -1) * 0.018 * open;
    if (axis === 0) ox += d; else oz += d;
  });
  const spread = E.inOutCubic(unit(46.0, 47.6, t)) * (1 - E.inOutCubic(unit(58.6, 59.3, t)));
  ox = mix(ox, (T.c - (TCOLS - 1) / 2) * STREET, spread);
  oz = mix(oz, (T.r - (TROWS - 1) / 2) * STREET + (T.r >= TROWS / 2 ? 0.5 : -0.5) * (AVENUE - STREET), spread);
  return [ox, oz];
}
function tileHeight(T, t) {
  const cx = T.x0 + TW_ / 2, cz = T.z0 + TH_ / 2, d = Math.hypot(cx, cz * 1.4);
  const rise = E.outExpo(unit(48.0 + d * 0.12, 48.55 + d * 0.12, t), 5) * (1 - E.inOutCubic(unit(58.0, 58.6, t)));
  let wave = 0;
  if (t > 54 && t < 56.2) for (let b = 0; b < 4; b++) { const tb = 54 + b * 0.5 + (cx + MW) * 0.06; wave += hit(t - tb, 0.16) * (t >= tb ? 1 : 0) * 0.07; }
  const top0 = mix(0.25, 0.0, E.inOutCubic(unit(60.0, 60.8, t)));   // block sinks flush into the paper before the monument
  return top0 + rise * (0.12 + 0.85 * T.e) + wave;
}
function tileFlip(T, t) {
  if (t < 54 || t > 56.3) return 0;
  const cx = T.x0 + TW_ / 2, ph = (t - 54) * 2 - (cx + MW) / (2 * MW) * 0.9;
  const k = ph - Math.floor(ph);
  return (Math.floor(ph) % 2 === 0 && k < 0.5 && Math.floor(ph) >= 0 && Math.floor(ph) < 4) ? sstep(0, 0.12, k) * (1 - sstep(0.38, 0.5, k)) : 0;
}

/* thread network: the original thread is the main line (z = 0 street); a branch reaches every tower */
function routeFor(T, t) {
  const [ox, oz] = tileOffset(T, t);
  const x0 = T.x0 + ox, z0 = T.z0 + oz, zc = z0 + TH_ / 2;
  const xs = x0 - STREET / 2;                     // street on the tower's west side
  const zMain = 0;
  return [[xs, zMain], [xs, zc], [x0, zc]];
}
function polyLen(P) { let s = 0; for (let i = 1; i < P.length; i++) s += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); return s; }
function polyAt(P, d) {
  for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); if (d <= l) { const f = l ? d / l : 0; return [mix(P[i - 1][0], P[i][0], f), mix(P[i - 1][1], P[i][1], f)]; } d -= l; }
  return P[P.length - 1];
}
function polyPart(P, d0, d1) {
  const out = [polyAt(P, d0)]; let acc = 0;
  for (let i = 1; i < P.length; i++) { acc += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); if (acc > d0 && acc < d1) out.push(P[i]); }
  out.push(polyAt(P, d1)); return out;
}

function drawSlabs(S, t) {
  if (t >= 45.05) return;
  if (S.yC > 1e-4 || S.hC > 0) { const f = chartXf(S); Solids.box(-MW, -0.035, CT - 0.05, MW, 0, CB + 0.02, PAPER, WALL_PAPER, f); if (S.hC < 0.05 && S.dock < 0.05) dropShadow(-MW, CT - 0.05, MW, CB, S.yC - 0.035, 0.18); }
  if (S.yR > 1e-4 || S.hR > 0) { const f = colXf(S); Solids.box(COLX - 0.04, -0.035, -1.05, UI_RIGHT + 0.04, 0, CB + 0.02, PAPER, WALL_PAPER, f); if (S.hR < 0.05 && S.dock < 0.05) dropShadow(COLX, -1, UI_RIGHT, CB, S.yR - 0.035, 0.18); }
}
function renderSystem(t, cam) {
  Fills.rectXZ(SHEET[0], SHEET[1], SHEET[2], SHEET[3], -0.004, C4(PAPER));
  Lines.begin();
  const tilesOn = t >= 45.0;
  let mapTop = null;
  const S = t < 45.0 ? drawSheet(t, cam) : slabs(t);
  drawSlabs(S, t);
  if (!tilesOn) {
    // map slab (black, with the contour map printed on top)
    const y = S.yM, th = S.thM;
    if (y > 1e-4) { Solids.box(-MW, y - th, -1, MW, y, 1, INK, WALL_PAPER); dropShadow(-MW, -1, MW, 1, y - th); }
    else Fills.rectXZ(-MW, -1, MW, 1, -0.0015, C4(INK));
    mapTop = y + MAP_LIFT;          // printed by the terrace mesh itself: identical lines to Movement II and to the monument
  } else {
    // ---- the map as 32 tiles: one block -> binary subdivision -> streets -> towers -> reassembly
    const floating = t < 45.2 ? S.yM - S.thM : 0, merged = t >= 59.9;
    if (merged) mapTop = tileHeight(TILES[0], t) + MAP_LIFT;
    if (floating > 1e-4) dropShadow(-MW, -1, MW, 1, floating);
    for (const T of TILES) {
      const [ox, oz] = tileOffset(T, t);
      const x0 = T.x0 + ox, z0 = T.z0 + oz, x1 = x0 + TW_, z1 = z0 + TH_;
      const top = t < 45.2 ? S.yM : tileHeight(T, t);
      const bot = floating;
      if (top > 1e-4) Solids.box(x0, Math.min(bot, top - 1e-4), z0, x1, top, z1, INK, WALL_PAPER);
      const ym = top + MAP_LIFT;
      if (!merged) MapSurf.quad([[x0, ym, z0], [x1, ym, z0], [x1, ym, z1], [x0, ym, z1]], [[T.x0, -T.z0], [T.x0 + TW_, -T.z0], [T.x0 + TW_, -(T.z0 + TH_)], [T.x0, -(T.z0 + TH_)]], 1, tileFlip(T, t));
      // kinetic labels on the south face of each tower
      const lab = E.outCubic(unit(52.0 + T.c * 0.03, 52.3 + T.c * 0.03, t)) * (1 - unit(57.6, 58.0, t));
      if (lab > 0 && top > 0.3) {
        const north = T.r < TROWS / 2, zf = north ? z1 + 0.0015 : z0 - 0.0015, right = north ? [1, 0, 0] : [-1, 0, 0], xs = north ? x0 + 0.025 : x1 - 0.025;
        const sz = 0.034, roll = (i) => ({ dy: (1 - spring(t - 52.0 - T.c * 0.03 - i * 0.02, 30)) * 1.4 });
        Text.world('text', T.id, [xs, 0.115, zf], right, [0, -1, 0], sz, C4(INK, lab), { track: 0.12, glyph: roll, clip: [-1, -sz * 1.05, 9, sz * 0.25] });
        Text.world('text', String(Math.round(T.e * 870)).padStart(3, '0') + ' M', [xs, 0.07, zf], right, [0, -1, 0], sz * 0.8, C4(INK, lab * 0.7), { track: 0.1, glyph: roll, clip: [-1, -sz * 0.85, 9, sz * 0.2] });
      }
    }
    // the main line (the thread) drops into the street the subdivision opened under it
    const zs = sectionZ(t), blockTop = mix(0.25, 0.0, E.inOutCubic(unit(60.0, 60.8, t)));
    const down = E.inOutCubic(unit(45.125, 45.4, t)), up = E.inOutCubic(unit(58.55, 59.05, t));
    const yline = mix(mix(S.yM + 0.002, 0.003, down), blockTop + 0.002, up);
    const ext = MW + 3.5 * STREET * E.inOutCubic(unit(46.0, 47.6, t)) * (1 - E.inOutCubic(unit(58.6, 59.3, t)));
    Lines.seg([-ext, yline, zs], [ext, yline, zs], C4(ORANGE), 3.0);
    // branches + data pulses (draw on 50.0–50.6, retract 56.8–57.6)
    for (const T of TILES) {
      const P = routeFor(T, t), Ln = polyLen(P);
      const on = E.inOutCubic(unit(50.0 + T.c * 0.04 + T.r * 0.02, 50.45 + T.c * 0.04 + T.r * 0.02, t)), off = E.inOutCubic(unit(56.8, 57.6, t));
      const d0 = Ln * off, d1 = Ln * on;
      if (d1 - d0 < 1e-4) continue;
      Lines.poly(polyPart(P, d0, d1).map((p) => [p[0], 0.003, p[1]]), C4(ORANGE, 0.85), 1.6);
      // pulses: launched on every 16th, outward until 56 s, then converging toward the main line
      if (t > 50.5 && t < 57.0) for (let k = 0; k < 4; k++) {
        const ph = ((t - 50.5) * 2 + k / 4 + (T.c + T.r * 3) * 0.13) % 1, conv = t > 56.0;
        const dd = (conv ? 1 - ph : ph) * Ln;
        if (dd < d0 || dd > d1) continue;
        const a = polyAt(P, Math.max(d0, dd - 0.05)), b = polyAt(P, dd);
        Lines.seg([a[0], 0.005, a[1]], [b[0], 0.005, b[1]], C4(PAPER, 1), 3.2);
      }
    }
  }
  Fills.flush(cam);
  Solids.flush(cam, [0.018, 1.0, t >= 44.4 ? 0.5 : 0]);
  MapSurf.draw(cam, {});
  if (mapTop !== null) { Terraces.upload(TERR.mesh2, 'm2'); Terraces.draw(cam, Object.assign(terraceState(t), { xf: [0, 0, 1, mapTop] })); }
  Glyph3D.flush(cam);
  Lines.flush(cam, true, 0.0012);
}

/* ---- audio.js ---- */
/* =====================================================================
   SOUNDTRACK — original composition, synthesized with OfflineAudioContext.
   120 BPM, 4/4, D minor. 75 s = 37 bars + 1/2 bar. 48 kHz stereo.
   The cycle is rendered after a pre-roll of the previous cycle's last bars,
   so every tail that crosses 75.000 s wraps into the start: the loop is seamless.
   Form: I thread/signal (bars 1-8) · II terrain, drop 1 at 0:20 (9-16) ·
   III system (17-24) · IV network (25-31) · V monument, drop 2 at 1:02, title (32-37½)
   ===================================================================== */
window.renderSoundtrack = async (opts = {}) => {
  const SR = 48000, CYCLE = 75, PRE = 6, NC = opts.verify ? 3 : 2, LEN = CYCLE * NC;
  const ctx = new OfflineAudioContext(2, SR * LEN, SR);
  const rnd = mulberry32(20261011);
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const B = (n) => n * 0.5;            // beat -> seconds
  const S16 = (bar, step) => bar * 2 + step * 0.125;

  // ---------------------------------------------------------- shared resources
  const noiseBuf = ctx.createBuffer(2, SR * 6, SR);
  for (let c = 0; c < 2; c++) { const d = noiseBuf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  const curve = (drive) => { const n = 2048, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(x * drive) / Math.tanh(drive); } return c; };
  function IR(sec, decay, seed) {
    const r = mulberry32(seed), b = ctx.createBuffer(2, Math.floor(SR * sec), SR);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) { const tt = i / SR; d[i] = (r() * 2 - 1) * Math.exp(-tt / decay) * (1 - Math.exp(-tt / 0.004)); } }
    return b;
  }
  const G = (v = 1) => { const g = ctx.createGain(); g.gain.value = v; return g; };

  // ---------------------------------------------------------- buses
  const master = G(0.9);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.12;
  master.connect(comp); comp.connect(ctx.destination);
  const verb = ctx.createConvolver(); verb.buffer = IR(2.4, 0.55, 99); const verbRet = G(0.32); verb.connect(verbRet); verbRet.connect(master);

  out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); wstr(36, 'data'); out.setUint32(40, n * 4, true);

    const x = (c ? R[i] : L[i]) * gain * 32767 + (dr() - dr());

};

/* =====================================================================
   BOOT + PUBLIC API
   window.seek(t)            render the frame at absolute time t (s). Deterministic, stateless.
   window.captureFrame(t, offsets, weights) -> base64 RGB24 of a temporally supersampled frame
   window.renderSoundtrack() -> base64 WAV (48 kHz stereo 16-bit)
   ===================================================================== */
async function init() {
  await Text.init();
  FIELDS.terr = buildTerrain(TERRAIN_A, 1907);
  TEX.terr = fieldTexture(FIELDS.terr, GX, GY);
  FIELDS.terr2 = buildTerrain(TERRAIN_B, 1907);
  TEX.terr2 = fieldTexture(FIELDS.terr2, GX, GY);
  const sig = await buildWordField('SIGNAL', 'IDB', 900, 2.86, 0.0);
  FIELDS.sig = sig; TEX.sig = fieldTexture(sig.G, GX, GY);
  const tit = await buildWordField('ISOLINE', 'IDB', 900, 2.62, 0.0);
  FIELDS.tit = tit; TEX.tit = fieldTexture(tit.G, GX, GY);
  FieldPlane.init(); Terraces.init(); Lines.init(); Fills.init(); Solids.init(); MapSurf.init(); Glyph3D.init();
  if (typeof sceneInit === 'function') sceneInit();
}

// wrap only outside [0, DUR] so that seek(DUR) is genuinely evaluated by the closing motion
const wrapT = (t) => (t < 0 || t > DUR ? ((t % DUR) + DUR) % DUR : t);
window.seek = (t) => { renderFrame(wrapT(t)); gl.finish(); return true; };

let _acc = null, _px = null;
window.captureFrame = (t, offsets = [0], weights = [1]) => {
  const N = W * H;
  if (!_acc) { _acc = new Float32Array(N * 3); _px = new Uint8Array(N * 4); }
  _acc.fill(0);
  let wsum = 0;
  for (let k = 0; k < offsets.length; k++) {
    renderFrame(wrapT(t + offsets[k]));
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, _px);
    const w = weights[k]; wsum += w;
    for (let y = 0; y < H; y++) {           // flip: GL rows are bottom-up
      const src = (H - 1 - y) * W * 4, dst = y * W * 3;
      for (let x = 0; x < W; x++) {
        const s = src + x * 4, d = dst + x * 3;
        _acc[d] += _px[s] * w; _acc[d + 1] += _px[s + 1] * w; _acc[d + 2] += _px[s + 2] * w;
      }
    }
  }
  const out = new Uint8Array(N * 3), inv = 1 / wsum;
  for (let i = 0; i < N * 3; i++) out[i] = Math.min(255, Math.round(_acc[i] * inv));
  let s = '';
  for (let i = 0; i < out.length; i += 0x8000) s += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
  return btoa(s);
};

window.ready = init().then(() => { window.seek(0); window.__ready = true; return true; })
  .catch((e) => { window.__error = String(e && e.stack || e); console.error(e); throw e; });

// optional live preview: click to play with sound (the render path never uses this)
document.addEventListener('click', async () => {
  if (window.__playing || !window.renderSoundtrack) return;
  window.__playing = true;
  const ac = new AudioContext({ sampleRate: 48000 });
  const b64 = await window.renderSoundtrack();
  const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const buf = await ac.decodeAudioData(bin.buffer);
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
  const t0 = ac.currentTime + 0.1; src.start(t0);
  const loop = () => { const t = (ac.currentTime - t0); if (t >= 0) window.seek(t % DUR); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});

</script>
</body>
